<style>
/* Layout: night-blue club house. Glass header with the sport picker, a hero with a lit lighthouse scene (the club's namesake), stat cards, pill tabs, then cards. Single dark navy-and-yellow theme by choice (club colours). */
:root{
  --night:#060e20; --navy:#0d1c3d; --navy-2:#132a5a; --navy-3:#1b3878;
  --line:rgba(150,178,235,.16); --line-2:rgba(150,178,235,.28);
  --yellow:#ffe500; --yellow-2:#ffc800; --yellow-soft:#fff2a6;
  --ink:#f5f3ea; --muted:#9bb0d6; --dim:#6f86b3;
  --good:#4fd68a; --bad:#ff7466; --present:#4f86ff; --absent:#1b2b52; --ball:#f8f8f2;
  --pitch:#0f3d30; --pitch-2:#0c3429; --pitch-line:rgba(245,243,234,.24);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --r:16px; --shadow:0 18px 40px -18px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;position:relative;min-height:100vh}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 500px at 85% -10%,rgba(255,229,0,.10),transparent 60%),radial-gradient(800px 600px at -10% 10%,rgba(79,134,255,.14),transparent 60%),radial-gradient(1000px 700px at 50% 120%,rgba(27,56,120,.55),transparent 70%),repeating-linear-gradient(115deg,rgba(var(--hl),.012) 0 2px,transparent 2px 14px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--night)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:.95}
p{margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.label{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.13em;font-weight:600;font-size:13px;color:var(--muted)}
.stripes{display:inline-flex;gap:3px;vertical-align:middle}
.stripes i{width:4px;height:22px;background:var(--yellow);border-radius:1px}
.stripes i:nth-child(even){background:var(--navy-3)}

/* Header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:rgba(var(--bg-rgb),.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:3px;background:repeating-linear-gradient(90deg,var(--yellow) 0 22px,var(--navy-3) 22px 44px);opacity:.9}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-family:var(--f-display);font-weight:900;font-size:27px;line-height:1;color:var(--accent);letter-spacing:.03em;text-transform:uppercase}
.brand span{display:block;font-family:var(--f-label);font-size:12px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.picker{display:flex;align-items:center;gap:10px}
.select-wrap{position:relative}
.select-wrap select{appearance:none;-webkit-appearance:none;background:linear-gradient(180deg,var(--yellow),var(--yellow-2));color:var(--on-accent);border:0;border-radius:999px;padding:11px 46px 11px 20px;font-family:var(--f-label);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;min-width:240px;max-width:100%;box-shadow:0 8px 24px -10px rgba(255,229,0,.6)}
.select-wrap::after{content:"";position:absolute;right:20px;top:50%;width:8px;height:8px;border-right:3px solid var(--on-accent);border-bottom:3px solid var(--on-accent);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.select-wrap select option{background:var(--navy);color:var(--ink)}

/* Hero */
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:44px;padding-block:44px 30px;align-items:center}
.otd{display:inline-flex;align-items:flex-start;gap:10px;background:rgba(255,229,0,.08);border:1px solid rgba(255,229,0,.28);border-radius:14px;padding:9px 14px;max-width:62ch;margin-bottom:22px}
.otd::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 12px var(--yellow);margin-top:7px;flex:none}
.otd strong{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--accent);white-space:nowrap}
.otd p{font-size:15px;color:var(--ink)}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--f-label);font-weight:700;font-size:17px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-weight:900;font-size:clamp(54px,9vw,136px);overflow-wrap:break-word;text-transform:uppercase;margin-top:10px;letter-spacing:-.005em;background:linear-gradient(180deg,var(--h1a) 30%,var(--h1b));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .nick{font-style:italic;color:var(--muted);font-size:19px;margin-top:12px}
.hero .lede{max-width:58ch;font-size:18px;margin-top:18px;color:#dfe5f3}
.scene{position:relative;aspect-ratio:1/1.02;max-width:100%;border-radius:28px;overflow:hidden;border:1px solid var(--line-2);box-shadow:var(--shadow),inset 0 0 0 1px rgba(var(--hl),.04);background:linear-gradient(180deg,#081633 0%,#0d2350 55%,#123168 100%)}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.scene .num{position:absolute;right:18px;top:10px;font-family:var(--f-display);font-weight:900;font-size:clamp(70px,10vw,120px);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(255,229,0,.55);letter-spacing:.02em}
.scene .cap{position:absolute;left:18px;bottom:14px;font-family:var(--f-label);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(245,243,234,.75)}
.beam{transform-origin:200px 150px;animation:sweep 6s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
.wave1{animation:drift 9s linear infinite}.wave2{animation:drift 13s linear infinite reverse}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-200px)}}
.twinkle{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{position:relative;background:linear-gradient(180deg,rgba(var(--hl),.05),rgba(var(--hl),.015));border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;overflow:hidden;display:flex;flex-direction:column;gap:4px}
.stat::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--yellow),transparent)}
.stat .v{font-family:var(--f-display);font-weight:900;font-size:46px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.stat .k{font-family:var(--f-label);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.home{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;padding-top:16px;color:var(--muted);font-size:15px}
.home b{color:var(--ink);font-weight:600}

/* Tabs */
.tabs{display:flex;gap:6px;margin-top:34px;padding:6px;background:rgba(var(--panel-rgb),.75);border:1px solid var(--line);border-radius:999px;overflow-x:auto;scrollbar-width:none;width:max-content;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 18px;border-radius:999px;font-family:var(--f-label);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.tab:hover{color:var(--ink);background:rgba(var(--hl),.05)}
.tab[aria-selected="true"]{background:var(--yellow);color:var(--on-accent)}
.panel{padding-block:34px 80px}
.panel>h2,.panel h2.ph{display:flex;align-items:center;gap:14px;font-size:clamp(36px,6vw,58px);font-weight:900;text-transform:uppercase}
.panel h2::before{content:"";width:22px;height:30px;flex:none;background:repeating-linear-gradient(90deg,var(--yellow) 0 4px,transparent 4px 8px)}
.panel .intro{color:var(--muted);margin-top:10px;max-width:66ch;font-size:16.5px}
.gnote{font-size:14px;color:var(--dim);margin-top:10px}

/* Generic */
.card,.box,.quiz{background:linear-gradient(180deg,rgba(var(--hl),.055),rgba(var(--hl),.018));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.box{padding:20px}
.box h3{font-family:var(--f-label);font-weight:700;font-size:23px;line-height:1.15}
.btn{background:linear-gradient(180deg,var(--yellow),var(--yellow-2));color:var(--on-accent);border:0;border-radius:999px;padding:11px 22px;font-family:var(--f-label);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 8px 20px -10px rgba(255,229,0,.7)}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.ghost:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--yellow);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.msg{min-height:1.5em;margin-top:12px;font-weight:500}
.msg.good{color:var(--good)}.msg.bad{color:var(--bad)}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.filter button{background:rgba(var(--hl),.03);border:1px solid var(--line-2);border-radius:999px;padding:7px 15px;font-family:var(--f-label);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--muted);cursor:pointer}
.filter button:hover{color:var(--ink)}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--on-accent);border-color:var(--ink)}
.chip{display:inline-block;font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--navy-3);color:var(--ink)}
.chip.win{background:var(--yellow);color:var(--on-accent)}
.chip.loss{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-2)}
.count{font-family:var(--f-display);font-weight:900;font-size:48px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.guessbar{display:flex;gap:8px;margin-top:16px}
.guessbar input{flex:1;min-width:0;background:rgba(var(--bg-rgb),.7);border:1px solid var(--line-2);border-radius:999px;padding:11px 18px;color:var(--ink);font-size:16px}
.guessbar input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(255,229,0,.18)}
.toggle{display:flex;align-items:center;gap:8px;font-family:var(--f-label);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--muted);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.wtop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

/* History */
.timeline{list-style:none;margin:30px 0 0;padding:0 0 0 26px;position:relative;max-width:860px}
.timeline::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--yellow),var(--navy-3))}
.timeline li{position:relative;padding:0 0 26px 18px}
.timeline li::before{content:"";position:absolute;left:-26px;top:10px;width:14px;height:14px;border-radius:50%;background:var(--night);border:3px solid var(--yellow)}
.timeline .yr{font-family:var(--f-display);font-weight:900;font-size:38px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.timeline h3{font-family:var(--f-label);font-weight:700;font-size:22px;line-height:1.2;margin-top:4px}
.timeline p{color:var(--muted);margin-top:4px;max-width:64ch}

/* Big games */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;margin-top:24px}
.game{padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0;position:relative;overflow:hidden}
.game::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(rgba(255,229,0,.12),transparent 70%)}
.game .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.game .score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.game .team{font-family:var(--f-label);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.game .team.fb{color:var(--accent)}
.game .team:last-child{text-align:right}
.game .res{font-family:var(--f-display);font-weight:900;font-size:48px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.game .title{font-family:var(--f-display);font-weight:900;font-size:32px;text-transform:uppercase;color:var(--accent);line-height:1}
.game p{color:var(--muted);font-size:15px}
.game .where{font-size:13px;color:var(--dim);font-family:var(--f-label);letter-spacing:.06em;text-transform:uppercase;border-top:1px dashed var(--line-2);padding-top:10px;margin-top:auto}

/* Legends */
.legends{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:26px}
.legend{overflow:hidden;display:flex;flex-direction:column;min-width:0}
.legend .mono{height:120px;position:relative;background:repeating-linear-gradient(90deg,var(--yellow) 0 16px,var(--navy-3) 16px 32px);display:flex;align-items:flex-end;padding:0 16px}
.legend .mono::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(var(--bg-rgb),.85))}
.legend .mono span{position:relative;z-index:1;font-family:var(--f-display);font-weight:900;font-size:72px;line-height:.8;color:var(--ink);transform:translateY(6px);text-shadow:0 4px 0 rgba(var(--bg-rgb),.5)}
.legend .body{padding:20px 16px 18px;display:flex;flex-direction:column;gap:6px}
.legend h3{font-family:var(--f-label);font-weight:700;font-size:22px;line-height:1.1}
.legend .role{font-family:var(--f-label);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--yellow-soft)}
.legend p{color:var(--muted);font-size:15px}

/* Trophies */
.cabinet{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:26px}
.trophy{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;padding:22px;align-items:start}
.trophy .count{font-size:70px;line-height:.85}
.trophy h3{font-family:var(--f-label);font-weight:700;font-size:22px}
.trophy .years{color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums;font-size:15px}
.cups{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
.cups svg{width:18px;height:22px}.cups svg path{fill:var(--yellow)}

/* Quiz */
.quiz{margin-top:26px;max-width:760px;padding:26px}
.quiz .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.progress{height:6px;background:var(--navy-2);border-radius:3px;margin-top:12px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow-2),var(--yellow));transition:width .3s}
.quiz h3{font-family:var(--f-label);font-weight:700;font-size:26px;line-height:1.2;margin-top:20px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{text-align:left;background:var(--navy-2);border:2px solid transparent;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:500;cursor:pointer;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--navy-2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--navy-2))}
.explain{margin-top:16px;color:var(--muted)}.explain b{color:var(--ink)}
.qnext{margin-top:18px}
.final{font-family:var(--f-display);font-weight:900;font-size:96px;line-height:1;color:var(--accent);margin-top:12px}

/* Branches */
.branches{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:26px}
.branch{padding:20px;min-width:0;position:relative;overflow:hidden}
.branch::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--yellow)}
.branch h3{font-family:var(--f-label);font-weight:700;font-size:22px}
.branch p{color:var(--muted);font-size:15px;margin-top:6px}

/* ---------- Games ---------- */
.draft{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;margin-top:22px;align-items:start}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.pitch2{position:relative;width:100%;aspect-ratio:5/6;max-width:100%;border-radius:20px;border:1px solid var(--pitch-line);background:repeating-linear-gradient(180deg,var(--pitch) 0 8.33%,var(--pitch-2) 8.33% 16.66%);overflow:hidden;box-shadow:var(--shadow),inset 0 0 60px rgba(0,0,0,.35)}
.pitch2::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid var(--pitch-line)}
.pitch2::after{content:"";position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:2px solid var(--pitch-line);border-radius:50%;transform:translate(-50%,-50%)}
.pitch2 .box18{position:absolute;left:28%;right:28%;bottom:0;height:13%;border:2px solid var(--pitch-line);border-bottom:0}
.pitch2 .box18.top{top:0;bottom:auto;border-top:0;border-bottom:2px solid var(--pitch-line)}
.ps{position:absolute;z-index:2;transform:translate(-50%,-50%);width:21%;max-width:96px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;background:none;border:0;padding:0;color:inherit}
button.ps{cursor:pointer}
.ps .disc{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(var(--bg-rgb),.8);border:2px dashed var(--pitch-line);font-family:var(--f-label);font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.04em;transition:transform .15s}
button.ps:hover .disc{transform:scale(1.06)}
.ps.filled .disc{background:radial-gradient(circle at 30% 25%,#fff7b0,var(--yellow) 45%,var(--yellow-2));border:2px solid var(--yellow);color:var(--on-accent);font-family:var(--f-display);font-size:21px;font-weight:900;box-shadow:0 6px 14px -6px rgba(0,0,0,.6)}
.ps.oop .disc{box-shadow:0 0 0 3px var(--bad)}
.ps.active .disc{border:2px solid var(--yellow);color:var(--accent);box-shadow:0 0 0 6px rgba(255,229,0,.22);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,229,0,.08)}}
.ps.missed .disc{border:2px solid var(--bad);color:var(--bad)}
.ps .nm{font-family:var(--f-label);font-weight:600;font-size:13.5px;line-height:1.05;color:var(--ink);overflow-wrap:anywhere;max-width:100%;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.ps .nm.dim{color:var(--muted)}
.ps .cap{position:absolute;top:-4px;left:calc(50% + 14px);width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--on-accent);font-family:var(--f-label);font-weight:700;font-size:12px;display:grid;place-items:center}
.cands2{display:grid;gap:8px;margin-top:14px}
.cand2{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;background:var(--navy-2);border:2px solid transparent;border-radius:14px;padding:10px 14px;cursor:pointer;transition:border-color .15s,transform .15s}
.cand2:hover{border-color:var(--accent);transform:translateX(2px)}
.cand2 .r{font-family:var(--f-display);font-weight:900;font-size:38px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.cand2 .info{display:flex;flex-direction:column;min-width:0}
.cand2 b{font-weight:600;line-height:1.2}
.cand2 small{font-family:var(--f-label);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tag{font-style:normal;font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--navy);color:var(--muted);white-space:nowrap}
.tag.bad{background:var(--bad);color:var(--on-accent)}.tag.good{background:var(--good);color:var(--on-accent)}
.ovr{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.ovr .big{font-family:var(--f-display);font-weight:900;font-size:78px;line-height:.85;color:var(--accent);font-variant-numeric:tabular-nums}
.ovr dl{display:grid;grid-template-columns:auto auto;gap:2px 12px;margin:0;font-size:14px}
.ovr dt{color:var(--muted)}.ovr dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.formsel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}
.formsel select{background:var(--navy-2);border:1px solid var(--line-2);border-radius:999px;padding:9px 16px;color:var(--ink);font-family:var(--f-label);font-weight:700;font-size:16px;letter-spacing:.05em}
.bracket{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}
.bracket li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:rgba(var(--bg-rgb),.55);border:1px solid var(--line)}
.bracket li.next{border-color:var(--accent)}.bracket li.w{border-color:var(--good)}.bracket li.l{border-color:var(--bad)}
.bracket .res{font-family:var(--f-label);font-weight:700;font-variant-numeric:tabular-nums}
.scout{margin-top:14px;display:grid;gap:4px}
.scoreboard{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;margin-top:16px;background:#040a18;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.scoreboard .tm{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.04em;line-height:1.1}
.scoreboard .tm:first-child{color:var(--accent)}.scoreboard .tm:last-child{text-align:right}
.scoreboard .sc{font-family:var(--f-display);font-weight:900;font-size:46px;line-height:1;font-variant-numeric:tabular-nums;color:var(--yellow-soft)}
.clockline{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:8px}
.ticker{list-style:none;margin:10px 0 0;padding:0;max-height:240px;overflow:auto;display:grid;gap:4px}
.ticker li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;font-size:14.5px;color:var(--muted);border-left:3px solid transparent;padding:3px 0 3px 8px}
.ticker li span{font-family:var(--f-label);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.ticker li.goal{color:var(--ink);font-weight:600;border-left-color:var(--accent)}
.ticker li.goal.opp{border-left-color:var(--ink)}
.ticker li.card{color:var(--yellow-soft)}
.ticker li.ht,.ticker li.ft{color:var(--ink);font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em}

/* Fenerdle */
.wgame{display:grid;grid-template-columns:auto minmax(0,330px);gap:34px;justify-content:center;align-items:start;margin-top:10px}
.wgrid{display:flex;flex-direction:column;gap:6px;margin:22px auto 0;align-items:center}
.wrow{display:flex;gap:var(--g)}
.tile{width:var(--t);aspect-ratio:1;border:2px solid var(--line-2);border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:calc(var(--t) * .56);text-transform:uppercase;line-height:1;background:rgba(var(--bg-rgb),.4)}
.tile.sp{border:0;background:none;width:calc(var(--t) * .4)}
.tile.filled{border-color:var(--muted)}
.tile.correct{background:var(--yellow);border-color:var(--accent);color:var(--on-accent)}
.tile.present{background:var(--present);border-color:var(--present);color:var(--ink)}
.tile.absent{background:var(--absent);border-color:var(--absent);color:var(--dim)}
@media (prefers-reduced-motion:no-preference){.tile.flip{animation:flip .45s ease both}@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:none}}}
.wside{display:flex;flex-direction:column;gap:12px;margin-top:22px;min-width:0}
.hints{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hint{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--navy-2);border:1px dashed var(--line-2);border-radius:12px;padding:8px 10px;cursor:pointer;color:var(--ink);min-width:0}
.hint b{font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.hint.on{border-style:solid;cursor:default;background:var(--navy)}
button.hint b{color:var(--accent)}
.wstats{padding:16px}
.wnums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;text-align:center}
.wnums b{display:block;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.wnums span{font-size:12px;color:var(--muted)}
.dist{display:grid;gap:4px;margin-top:12px}
.dist div{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.dist i{display:block;font-style:normal;text-align:right;padding:1px 6px;background:var(--absent);color:var(--ink);border-radius:4px;font-weight:600}
.dist i.hl{background:var(--yellow);color:var(--on-accent)}
.sharebox{width:100%;min-height:120px;background:var(--night);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
.legendrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--muted);margin-top:14px}
.legendrow i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.kb{display:flex;flex-direction:column;gap:6px;margin:20px auto 0;max-width:560px}
.kbr{display:flex;gap:5px;justify-content:center}
.key{flex:1 1 0;min-width:0;height:54px;border:0;border-radius:10px;background:var(--navy-3);color:var(--ink);font-family:var(--f-label);font-weight:700;font-size:16px;cursor:pointer;padding:0}
.key.wide{flex:1.6 1 0;font-size:13px}
.key.correct{background:var(--yellow);color:var(--on-accent)}.key.present{background:var(--present)}.key.absent{background:var(--absent);color:var(--dim)}
.wcenter{text-align:center}

/* Name the XI */
.seasons{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin-top:18px}
.seasons button{background:rgba(var(--hl),.03);border:1px solid var(--line);border-radius:10px;padding:7px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
.seasons button b{font-family:var(--f-label);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--ink);font-variant-numeric:tabular-nums}
.seasons button[aria-pressed="true"]{background:var(--yellow);border-color:var(--accent)}
.seasons button[aria-pressed="true"] b,.seasons button[aria-pressed="true"] .stars{color:var(--on-accent)}
.stars{color:var(--accent);letter-spacing:1px;font-size:11px;line-height:1}
.facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:14px}
.facts div{display:flex;flex-direction:column}
.facts b{font-family:var(--f-display);font-weight:900;font-size:30px;color:var(--accent);line-height:1.05}
.xinums{display:flex;gap:22px;margin-top:6px;align-items:baseline;flex-wrap:wrap}
.xinums div{display:flex;align-items:baseline;gap:6px}
.pitch2.xi .ps{width:19%}

/* Penalties */
.pk-wrap{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:24px;margin-top:22px;align-items:start}
.pk-field{position:relative;aspect-ratio:16/11;width:100%;background:linear-gradient(180deg,#0a2a22,var(--pitch));border-radius:20px;overflow:hidden;border:1px solid var(--pitch-line);cursor:crosshair;touch-action:manipulation;box-shadow:var(--shadow)}
.pk-field::before{content:"";position:absolute;left:0;right:0;top:0;height:12%;background:linear-gradient(180deg,rgba(var(--bg-rgb),.9),transparent)}
.pk-goal{position:absolute;left:15%;width:70%;top:12%;height:37.3%;border:6px solid var(--ink);border-bottom:0;border-radius:4px 4px 0 0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
  background:repeating-linear-gradient(45deg,rgba(245,243,234,.09) 0 1px,transparent 1px 11px),repeating-linear-gradient(-45deg,rgba(245,243,234,.09) 0 1px,transparent 1px 11px)}
.pk-zone{background:transparent;border:1px dashed rgba(245,243,234,.18);cursor:pointer;padding:0}
.pk-zone:hover{background:rgba(255,229,0,.22)}
.pk-line{position:absolute;left:0;right:0;top:49.3%;border-top:2px solid var(--pitch-line)}
.pk-box{position:absolute;left:22%;right:22%;top:49.3%;height:28%;border:2px solid var(--pitch-line);border-top:0}
.pk-spot{position:absolute;left:50%;top:88%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--pitch-line)}
.pk-keeper{position:absolute;width:7.6%;height:29%;transform:translate(-50%,-50%) rotate(var(--rot,0deg));transition:left .5s ease-out,top .5s ease-out,transform .5s ease-out;pointer-events:none;border-radius:40% 40% 12% 12%;border:2px solid var(--on-accent);background:repeating-linear-gradient(90deg,var(--yellow) 0 5px,var(--navy-3) 5px 10px);z-index:2}
.pk-keeper.them{background:repeating-linear-gradient(90deg,var(--ink) 0 5px,var(--dim) 5px 10px)}
.pk-ball{position:absolute;width:4.5%;aspect-ratio:1;border-radius:50%;background:var(--ball);box-shadow:inset -3px -3px 0 rgba(0,0,0,.25);transform:translate(-50%,-50%);transition:left .5s cubic-bezier(.2,.8,.3,1),top .5s cubic-bezier(.2,.8,.3,1),width .5s;pointer-events:none;z-index:3}
.notrans{transition:none!important}
.pk-aim{position:absolute;z-index:4;width:5%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid var(--yellow);border-radius:50%;pointer-events:none;box-shadow:0 0 0 2px var(--on-accent),0 0 16px rgba(255,229,0,.6)}
.pk-aim::before,.pk-aim::after{content:"";position:absolute;background:var(--yellow);left:50%;top:50%;transform:translate(-50%,-50%)}
.pk-aim::before{width:3px;height:160%}.pk-aim::after{height:3px;width:160%}
.pk-guide{position:absolute;top:8%;height:46%;border-left:2px dashed var(--yellow);opacity:.6;pointer-events:none;z-index:3}
.pk-banner{position:absolute;left:0;right:0;top:60%;text-align:center;font-family:var(--f-display);font-weight:900;font-size:clamp(28px,6vw,56px);text-transform:uppercase;color:var(--accent);text-shadow:0 3px 0 var(--on-accent),0 0 30px rgba(255,229,0,.4);pointer-events:none;z-index:5}
.pk-score{display:grid;gap:10px}
.pk-team{display:grid;grid-template-columns:112px minmax(0,1fr) auto;gap:10px;align-items:center}
.pk-team span{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2)}
.dot.g{background:var(--good);border-color:var(--good)}.dot.m{background:var(--bad);border-color:var(--bad)}
.pk-team b{font-family:var(--f-display);font-size:30px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
.wheelwrap{position:relative;width:min(100%,440px);aspect-ratio:1;margin:0 auto}
.wheelwrap canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 0 8px var(--navy-2),0 0 0 10px var(--yellow),var(--shadow)}
.wheelwrap .ptr{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--yellow);filter:drop-shadow(0 3px 0 var(--on-accent));z-index:2}
.wheelwrap .hub{position:absolute;left:50%;top:50%;width:18%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--navy-3),#081430);border:4px solid var(--yellow);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;color:var(--accent);font-size:clamp(14px,3vw,22px)}
.takers{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px;counter-reset:t}
.takers li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--navy-2);border:1px solid var(--line);counter-increment:t}
.takers li::before{content:counter(t);font-family:var(--f-display);font-weight:900;font-size:22px;color:var(--accent)}
.takers li.empty{background:transparent;border-style:dashed;color:var(--dim)}
.takers li.new{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,229,0,.15)}
.takers b{font-weight:600}
.takers em{font-style:normal;font-family:var(--f-display);font-weight:900;font-size:22px;color:var(--yellow-soft)}

/* Who am I */
.clues{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.clues li{background:var(--navy-2);border-radius:12px;padding:11px 14px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px}
.clues li span{font-family:var(--f-display);font-weight:900;color:var(--accent);font-size:20px;line-height:1.2}
.clues li.locked{color:var(--dim);background:transparent;border:1px dashed var(--line-2)}

/* Timeline game */
.tlhead{display:flex;gap:28px;align-items:center;margin-top:18px;flex-wrap:wrap}
.tlhead>div{display:flex;align-items:baseline;gap:6px}
.lives{display:flex;gap:6px}.lives i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2)}.lives i.on{background:var(--yellow);border-color:var(--accent);box-shadow:0 0 10px rgba(255,229,0,.5)}
.tlcur{margin-top:16px;max-width:760px;background:linear-gradient(135deg,var(--yellow),var(--yellow-2));color:var(--on-accent);border-radius:16px;padding:16px 18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);z-index:3;box-shadow:0 14px 30px -14px rgba(255,229,0,.6)}
.tlcur .label{color:var(--on-accent);opacity:.7}
.tlcur p{font-weight:600;font-size:18px;line-height:1.3;margin-top:4px}
.tlcur small{display:block;font-family:var(--f-label);letter-spacing:.08em;text-transform:uppercase;font-size:12px;font-weight:700}
.tl2{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:4px;max-width:760px}
.tl2 li.card{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center;padding:11px 14px;box-shadow:none}
.tl2 li.card.no{border-color:var(--bad)}.tl2 li.card.just.ok{border-color:var(--good)}
.tl2 .y{font-family:var(--f-display);font-weight:900;font-size:27px;color:var(--accent);font-variant-numeric:tabular-nums}
.tl2 .y.q{color:var(--dim)}
.tl2 .t{line-height:1.3}.tl2 .t small{display:block;font-family:var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-size:12px}
.tl2 li.ins button{width:100%;background:transparent;border:1px dashed var(--line-2);border-radius:10px;padding:6px;color:var(--dim);font-family:var(--f-label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;cursor:pointer}
.tl2 li.ins button:hover{border-color:var(--accent);color:var(--accent);background:rgba(255,229,0,.06)}

footer{margin-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;position:relative}
footer::before{content:"";position:absolute;left:0;right:0;top:-6px;height:5px;background:repeating-linear-gradient(90deg,var(--yellow) 0 22px,var(--navy-3) 22px 44px)}
footer .wrap{padding-block:26px 44px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:900px){
  .hero .wrap{grid-template-columns:minmax(0,1fr);gap:26px;padding-block:28px 24px}
  .scene{aspect-ratio:4/3}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .draft,.pk-wrap,.wgame{grid-template-columns:minmax(0,1fr)}
  .draft .side{order:-1}
  .wside{order:2}
}
@media (max-width:560px){
  .scene .cap{display:none}
  .brand span{display:none}.brand b{font-size:23px}
  .picker{flex-basis:100%}.select-wrap{flex:1}.select-wrap select{width:100%;min-width:0}
  .stat .v{font-size:36px}
  .opts{grid-template-columns:minmax(0,1fr)}
  .games,.legends,.branches,.cabinet{grid-template-columns:minmax(0,1fr)}
  .trophy{grid-template-columns:72px minmax(0,1fr)}.trophy .count{font-size:56px}
  .ps .disc{width:38px;height:38px;font-size:11px}.ps.filled .disc{font-size:16px}.ps .nm{font-size:11.5px}.ps .cap{width:16px;height:16px;font-size:10px;left:calc(50% + 10px)}
  .cand2{grid-template-columns:auto minmax(0,1fr)}.cand2 .tag{grid-column:2;justify-self:start}
  .cand2 .r{font-size:30px}
  .bracket li{grid-template-columns:minmax(0,1fr) auto}.bracket li .label{grid-column:1/-1}
  .key{height:46px;font-size:14px;border-radius:7px}
  .pk-team{grid-template-columns:96px minmax(0,1fr) auto}
  .tlcur{top:calc(env(safe-area-inset-top,0px) + 128px)}
  .tabs{border-radius:16px}
  .hints{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- Play tab ---------- */
.tab.play{display:inline-flex;align-items:center;gap:8px;color:var(--accent)}
.tab.play .ball{width:10px;height:10px;border-radius:50%;background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.tab.play[aria-selected="true"] .ball{background:var(--on-accent);box-shadow:none}
.launcher{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lcard{display:flex;flex-direction:column;gap:3px;text-align:left;padding:14px 14px 13px;border-radius:14px;cursor:pointer;color:var(--ink);background:linear-gradient(180deg,rgba(var(--hl),.05),rgba(var(--hl),.015));border:1px solid var(--line);transition:border-color .15s,transform .15s}
.lcard b{font-family:var(--f-label);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.lcard span{font-size:13.5px;color:var(--muted);line-height:1.3}
.lcard:hover{border-color:var(--line-2);transform:translateY(-1px)}
.lcard[aria-selected="true"]{background:linear-gradient(135deg,var(--yellow),var(--yellow-2));border-color:var(--accent);color:var(--on-accent)}
.lcard[aria-selected="true"] span{color:rgba(10,21,48,.75)}
.gamearea{margin-top:30px;padding-top:28px;border-top:1px solid var(--line)}
/* courts */
:root{--wood:#8a5a2c;--wood-2:#94622f;--wood-line:rgba(255,248,230,.7);--vb:#1b4a86;--vb-2:#163e72;--vb-line:rgba(255,255,255,.75);--rcv:#f5f3ea}
.court{position:relative;width:100%;aspect-ratio:5/5.6;max-width:100%;border-radius:20px;overflow:hidden;border:1px solid var(--line-2);box-shadow:var(--shadow)}
.court.bb{background:repeating-linear-gradient(90deg,var(--wood) 0 7%,var(--wood-2) 7% 14%)}
.court.vb{background:linear-gradient(180deg,var(--vb),var(--vb-2))}
.court .lines{position:absolute;inset:0;width:100%;height:100%}
.court .lines *{fill:none;stroke:var(--wood-line);stroke-width:2;vector-effect:non-scaling-stroke}
.court.vb .lines *{stroke:var(--vb-line)}
.court .lines .key{fill:rgba(10,21,48,.25)}
.court .lines .net{stroke-width:5;stroke:var(--ink)}
.court .ps{width:22%}
.ps.extra .disc{border-style:dotted}
.bench{margin-top:16px}
.benchgrid,.squadgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:10px}
.squadgrid{margin-top:0}
.benchgrid .ps,.squadgrid .ps{position:static;transform:none;width:auto;max-width:none;padding:12px 8px;border-radius:14px;background:rgba(var(--hl),.035);border:1px solid var(--line)}
.benchgrid .ps .nm,.squadgrid .ps .nm{text-shadow:none;font-size:14px}
.benchgrid .ps.filled,.squadgrid .ps.filled{border-color:rgba(255,229,0,.5)}
.qtable{overflow-x:auto;margin-top:10px}
.qtable table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
.qtable th,.qtable td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line)}
.qtable th:first-child{text-align:left;font-family:var(--f-label);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.qtable thead th{color:var(--muted);font-family:var(--f-label);font-weight:600}
.shooters{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:12px}
/* free throws */
:root{--board:#e9eef8;--rimc:#ff6b2b}
.ftcourt{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line-2);background:linear-gradient(180deg,#0a1a3a,#102a5c);box-shadow:var(--shadow)}
.ftcourt svg{display:block;width:100%;height:auto}
.ftcourt .floor{fill:var(--wood)}.ftcourt .board{fill:var(--board)}.ftcourt .board2{fill:none;stroke:var(--rimc);stroke-width:2}
.ftcourt .rim{stroke:var(--rimc);stroke-width:4}.ftcourt .net2{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.7}
.ftcourt .shooter{fill:var(--yellow);stroke:var(--on-accent);stroke-width:3}.ftcourt .shnum{fill:var(--on-accent);font-family:var(--f-display);font-weight:900;font-size:18px}
.ftcourt .ball{fill:#f08a24;stroke:#4a2408;stroke-width:1.5}
.meter{position:relative;height:30px;margin-top:14px;border-radius:999px;background:rgba(var(--bg-rgb),.7);border:1px solid var(--line-2);overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;background:rgba(255,229,0,.35)}.meter .zone.in{background:var(--yellow)}
.meter .mark{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--ink);box-shadow:0 0 0 2px var(--on-accent)}
.dot.half{background:var(--yellow-soft);border-color:var(--yellow-soft)}
/* serve */
.svcourt{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line-2);background:linear-gradient(180deg,#0a1a3a,#0d2350);box-shadow:var(--shadow);cursor:crosshair;touch-action:manipulation}
.svcourt svg{display:block;width:100%;height:auto;max-height:560px}
.svcourt .vfloor{fill:var(--vb);stroke:var(--vb-line);stroke-width:2}.svcourt .vline{stroke:var(--vb-line);stroke-width:2}.svcourt .vnet{fill:var(--ink)}
.svcourt .rcv{fill:var(--rcv);stroke:var(--on-accent);stroke-width:2;transition:cx .5s,cy .5s}.svcourt .trail{fill:var(--yellow);opacity:.5}
.svcourt .aim{fill:none;stroke:var(--yellow);stroke-width:3}.svcourt .guide{stroke:var(--yellow);stroke-dasharray:4 5;opacity:.6}
.svcourt .vball{fill:var(--yellow);stroke:var(--on-accent);stroke-width:2}
/* memory */
.memgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:20px;max-width:760px}
.mem{aspect-ratio:4/3;border-radius:14px;border:1px solid var(--line-2);cursor:pointer;padding:8px;display:grid;place-items:center;text-align:center;font-family:var(--f-label);font-weight:700;font-size:15px;line-height:1.15;letter-spacing:.02em;color:var(--ink);background:repeating-linear-gradient(90deg,var(--navy-2) 0 14px,var(--navy-3) 14px 28px);transition:transform .2s}
.mem:hover:not(:disabled){transform:translateY(-2px)}
.mem span{overflow-wrap:anywhere}.mem:not(.up) span{font-family:var(--f-display);font-weight:900;font-size:26px;color:rgba(255,229,0,.35)}
.mem.up{background:var(--navy);cursor:default}.mem.up.mk-branch{background:var(--navy-2);color:var(--accent)}
.mem.got{border-color:var(--good);box-shadow:0 0 0 2px rgba(79,214,138,.25)}
@media (max-width:560px){.launcher{grid-template-columns:repeat(2,minmax(0,1fr))}.lcard b{font-size:16px}.memgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.mem{font-size:13px}.benchgrid,.squadgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.shooters{grid-template-columns:minmax(0,1fr)}}

.gamearea>h2{display:flex;align-items:center;gap:14px;font-size:clamp(32px,5vw,48px);font-weight:900;text-transform:uppercase}
@media (max-width:560px){.hero h1{font-size:min(54px,12.5vw)}}

/* ---- Matches ---- */
.muted{color:var(--muted)}
.fine{color:var(--dim);font-size:13.5px;margin-top:12px}
.fine.src{margin-top:34px;border-top:1px dashed var(--line-2);padding-top:14px}
.fine a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.fine a:hover{color:var(--accent)}
.msum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:24px}
.mstat{border-left:3px solid var(--yellow);padding:4px 0 4px 14px;min-width:0}
.mstat b{display:block;font-family:var(--f-display);font-weight:900;font-size:clamp(28px,4.4vw,44px);line-height:1;color:var(--ink);text-transform:uppercase}
.mstat span{display:block;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--muted);margin-top:6px}
.mtop{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-top:22px}
.nextup{padding:22px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(255,229,0,.16),rgba(255,229,0,.02) 55%),linear-gradient(180deg,rgba(var(--hl),.055),rgba(var(--hl),.018))}
.nextup .label{color:var(--accent)}
.nx-teams{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px;margin:12px 0 14px;font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:clamp(30px,4.6vw,50px);line-height:1}
.nx-teams .fb{color:var(--accent)}
.nx-teams .vs{font-family:var(--f-label);font-size:16px;color:var(--dim);letter-spacing:.1em}
.nx-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-label);font-size:16px}
.nx-meta b{font-weight:700;color:var(--ink)}
.formcard{padding:20px;display:flex;flex-direction:column;gap:12px}
.form{display:flex;gap:8px}
.fo{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;font-family:var(--f-label);font-weight:800;font-size:15px;flex:none}
.fo.W{background:var(--yellow);color:var(--on-accent)}
.fo.D{background:var(--navy-3);color:var(--ink)}
.fo.L{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.linkbtn{align-self:flex-start;background:none;border:0;padding:0;font-family:var(--f-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--accent);cursor:pointer;margin-top:auto}
.linkbtn:hover{text-decoration:underline}
section>.linkbtn{margin-top:12px}
.mf{margin-top:26px}
.mcols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;margin-top:18px;align-items:start}
.mh{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:15px;color:var(--muted);margin-bottom:10px}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-left:3px solid var(--line-2);box-shadow:none}
.mrow.W{border-left-color:var(--accent)}.mrow.L{border-left-color:var(--bad)}.mrow.fx{border-left-color:var(--navy-3);border-left-style:dashed}
.md b{display:block;font-family:var(--f-label);font-weight:700;font-size:15px;line-height:1.1;white-space:nowrap}
.md span{font-size:12px;color:var(--dim);font-family:var(--f-label);letter-spacing:.06em;text-transform:uppercase}
.mm{display:flex;flex-direction:column;gap:2px;min-width:0}
.mcomp{font-family:var(--f-label);font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.mopp{font-family:var(--f-label);font-weight:700;font-size:18px;line-height:1.15;text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.mopp i{font-style:normal;display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:5px;background:var(--navy-3);color:var(--muted);font-size:11px;margin-right:8px;vertical-align:2px}
.mnote{font-size:13px;color:var(--muted)}
.ms{display:flex;align-items:center;gap:10px}
.sc{font-family:var(--f-display);font-weight:900;font-size:26px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sc em{font-style:normal;color:var(--dim);margin:0 2px}
.ms .fo{width:26px;height:26px;font-size:13px;border-radius:6px}
.kt{font-family:var(--f-label);font-weight:700;font-size:17px;color:var(--accent);font-variant-numeric:tabular-nums}

/* ---- Standings ---- */
.tjump{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.tjump a{font-family:var(--f-label);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--muted);text-decoration:none;border:1px solid var(--line-2);border-radius:999px;padding:6px 14px}
.tjump a:hover{color:var(--ink);border-color:var(--ink)}
.tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px;margin-top:22px;align-items:start}
.tcard{padding:20px;position:relative;min-width:0;scroll-margin-top:90px}
.tcard header{padding-right:90px}
.tcard h3{font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:28px;line-height:1}
.tcard header .label{display:block;margin-top:6px;font-size:12.5px}
.tpos{position:absolute;right:18px;top:16px;text-align:right}
.tpos b{display:block;font-family:var(--f-display);font-weight:900;font-size:40px;line-height:.9;color:var(--accent)}
.tpos span{font-family:var(--f-label);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.tscroll{overflow-x:auto;margin-top:16px}
.stand{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.stand th{font-family:var(--f-label);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line-2)}
.stand td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line);color:var(--muted)}
.stand .tm{text-align:left;color:var(--ink);font-weight:500;width:100%}
.stand .pos{text-align:left;width:34px;color:var(--dim);position:relative;padding-left:10px}
.stand td.kc,.stand th.kc{color:var(--ink);font-weight:700}
.stand tr.fbrow td{background:rgba(255,229,0,.13);color:var(--ink)}
.stand tr.fbrow .tm{color:var(--accent);font-weight:700}
.stand tr[class*=" z"] .pos::before,.stand tr[class^="z"] .pos::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:3px;border-radius:2px}
.stand tr.z0 .pos::before,.zleg i.z0{background:var(--good)}
.stand tr.z1 .pos::before,.zleg i.z1{background:var(--yellow-2)}
.stand tr.z2 .pos::before,.zleg i.z2{background:var(--line-2)}
.zleg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:13px;color:var(--muted)}
.zleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tnote{color:var(--muted);margin-top:12px;font-size:15px}
@media (max-width:760px){.mtop,.mcols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.msum{gap:8px}.mstat{padding-left:10px}.mstat span{font-size:11.5px;letter-spacing:.06em}.mrow{grid-template-columns:50px minmax(0,1fr) auto;gap:10px;padding:10px 11px}.mopp{font-size:16px}.sc{font-size:22px}.stand .hm{display:none}.stand{font-size:14px}.stand td,.stand th{padding:6px 4px}.tcard{padding:16px}.tcard h3{font-size:24px}}

/* ---- Language picker ---- */
.bar .wrap{justify-content:flex-start}
.brand{margin-right:auto}
.picker{order:2}
.langpick{order:3;position:relative;flex:none}
.langpick select{appearance:none;-webkit-appearance:none;background:rgba(var(--hl),.04);border:1.5px solid var(--line-2);border-radius:999px;width:96px;height:46px;padding:0 0 0 14px;color:transparent;cursor:pointer;font:inherit;font-size:16px}
.langpick select:hover,.langpick select:focus-visible{border-color:var(--accent)}
.langpick select:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.langpick select option{color:var(--ink);background:var(--navy)}
.langpick .lc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:7px;pointer-events:none;font-family:var(--f-label);font-weight:700;font-size:16px;letter-spacing:.1em;color:var(--ink)}
.langpick .lc svg{width:18px;height:18px;flex:none;color:var(--accent)}
.langpick .lc::after{content:"";width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-2px) rotate(45deg);margin-left:2px}
@media (max-width:560px){.langpick{order:2}.picker{order:3}.langpick select{width:88px;height:42px}}

/* ---- Squad / Venue / Derbies / Chart ---- */
.coach{padding:18px 20px;margin-top:20px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.coach b{font-family:var(--f-display);font-weight:900;font-size:30px;text-transform:uppercase;color:var(--accent)}
.coach p{flex-basis:100%;margin:0}
.sqgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;margin-top:22px;align-items:start}
.mh .cnt{color:var(--dim);font-weight:600;margin-left:4px}
.sqlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sqlist li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 14px;box-shadow:none}
.sqlist .no{font-family:var(--f-display);font-weight:900;font-size:24px;color:var(--accent);text-align:right}
.sqlist .nm{font-family:var(--f-label);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.sqlist .nat{font-size:13px;color:var(--muted);text-align:right}
.venue{padding:24px;margin-top:20px;max-width:820px}
.venue h3{font-family:var(--f-display);font-weight:900;font-size:clamp(32px,5vw,52px);text-transform:uppercase;line-height:1;margin:8px 0}
.vcap{font-family:var(--f-label);font-weight:700;font-size:18px;color:var(--accent);letter-spacing:.04em}
.vfacts{margin:14px 0 6px;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.vfacts li::marker{color:var(--accent)}
.venue .mh,.derby .mh{margin-top:18px}
.venue .linkbtn{margin-top:16px;display:inline-block;text-decoration:none}
.rleg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:16px;font-size:14px;color:var(--muted)}
.rleg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.rleg .w,.rbar .w{background:var(--yellow)}.rleg .d,.rbar .d{background:#5b6b91}.rleg .l,.rbar .l{background:var(--bad)}
.derbies{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;margin-top:16px;align-items:start}
.derby{padding:22px}
.derby h3{font-family:var(--f-display);font-weight:900;font-size:36px;text-transform:uppercase;line-height:1;margin-top:6px}
.dname{color:var(--muted);margin-top:4px}
.rec{margin-top:16px}
.rbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-top:8px;gap:2px;background:var(--navy-2)}
.rbar i{display:block;height:100%}
.rnums{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:14px;color:var(--muted)}
.rnums b{color:var(--ink);font-variant-numeric:tabular-nums}
.drecent{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.drecent li{display:grid;grid-template-columns:26px auto minmax(0,1fr) auto;align-items:center;gap:10px;font-size:14px}
.drecent .fo{width:24px;height:24px;font-size:12px;border-radius:6px}
.drecent b{font-family:var(--f-display);font-weight:900;font-size:20px}
.schart{padding:20px;margin:20px 0 26px}
.schart figcaption{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;align-items:baseline}
.schart figcaption b{font-family:var(--f-label);font-weight:700;font-size:18px}
.sleg{display:flex;gap:16px;margin-top:8px;font-size:14px;color:var(--muted)}
.sleg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.sleg .ch{background:var(--yellow)}.sleg .ot{background:#7d8fb8}
.swrap{position:relative;margin-top:10px}
.swrap svg{width:100%;height:auto;display:block}
.swrap .gl{stroke:var(--line);stroke-width:1}
.swrap .ax{fill:var(--dim);font:600 13px var(--f-label)}
.swrap .ln{fill:none;stroke:#5b6b91;stroke-width:2}
.swrap .ch{fill:var(--yellow);stroke:var(--night,#060e20);stroke-width:2}
.swrap .ot{fill:#7d8fb8;stroke:var(--night,#060e20);stroke-width:2}
.swrap .hit{fill:transparent;cursor:default}
.swrap .pt:hover .ot,.swrap .pt:hover .ch{stroke:var(--ink)}
.stip{position:absolute;width:110px;text-align:center;background:var(--navy);border:1px solid var(--line-2);border-radius:8px;padding:5px 6px;font:600 13px var(--f-label);pointer-events:none;color:var(--ink)}
.schart details{margin-top:10px}.schart summary{cursor:pointer;color:var(--muted);font-size:14px}
.stable{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px 12px;margin-top:10px;font-size:13px;color:var(--muted)}
.stable span{display:flex;justify-content:space-between;gap:6px}.stable b{color:var(--ink)}.stable .c b{color:var(--accent)}
/* ---- Matches extras ---- */
.cal{margin-top:12px;font-size:14px;color:var(--muted)}
.calmini a{color:var(--muted)}
.cal a,.calmini a:hover{color:var(--accent);text-decoration:none;font-weight:600}
.cal a:hover,.calmini a:hover{text-decoration:underline}
.calmini{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:11.5px;font-family:var(--f-label);letter-spacing:.04em}
.mrow.fx .ms{flex-direction:column;align-items:flex-end;gap:4px}
.predbox{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line-2)}
.prow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-top:8px}
.pin{display:flex;flex-direction:column;gap:4px;font-size:12px;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);max-width:140px}
.pin span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin input{width:72px;background:var(--navy-2);border:1.5px solid var(--line-2);border-radius:10px;padding:8px 10px;font:800 22px var(--f-display);color:var(--ink);text-align:center}
.pin input:focus{outline:2px solid var(--yellow);outline-offset:1px}
.dash{font-family:var(--f-display);font-size:26px;color:var(--dim);padding-bottom:8px}
.comm{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;margin-top:26px}
.commcard{padding:20px}.commcard h3{font-family:var(--f-label);font-weight:700;font-size:20px;text-transform:uppercase;margin-top:6px}
.commcard select{background:var(--navy-2);border:1.5px solid var(--line-2);border-radius:10px;padding:10px 12px;color:var(--ink);min-width:0;flex:1}
.tally{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:6px}

.tally i{display:block;height:8px;border-radius:4px;background:var(--yellow)}
.ptable{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:4px}
.ptable li{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:rgba(var(--hl),.03)}

.holrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center;margin-top:18px}
.holcard{padding:20px;min-height:170px;display:flex;flex-direction:column;gap:8px}

.holcard.ok{box-shadow:inset 0 0 0 2px var(--yellow)}.holcard.no{box-shadow:inset 0 0 0 2px var(--bad)}
.vsx{font-family:var(--f-label);color:var(--dim);text-transform:uppercase;letter-spacing:.1em}

.gtsrow .pin{max-width:220px}.gtsrow .pin span{font-size:14px;color:var(--ink)}

.dlres li.ok span{color:var(--accent)}.dlres li.no span{color:var(--bad)}
.dlres b{display:block;color:var(--muted);font-weight:600;grid-column:2}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px;margin-top:20px}
.badge{padding:16px;display:flex;flex-direction:column;gap:4px;opacity:.55}
.badge.on{opacity:1;box-shadow:inset 0 0 0 1.5px var(--yellow)}
.badge .medal{font-size:28px;color:var(--accent);line-height:1}.badge b{font-family:var(--f-label);font-size:18px;text-transform:uppercase}.badge span:last-child{font-size:14px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);background:var(--yellow);color:var(--on-accent);font-family:var(--f-label);font-weight:700;padding:12px 20px;border-radius:999px;z-index:40;transition:transform .35s ease;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px)}

@media (max-width:560px){.holrow{grid-template-columns:minmax(0,1fr)}.vsx{text-align:center}.holcard{min-height:0}.holcard .hv{font-size:44px}.drecent li{grid-template-columns:26px minmax(0,1fr) auto}.drecent li .muted{display:none}}

html[data-theme="pitch"]{--night:#062014;--navy:#0c3020;--navy-2:#11402b;--navy-3:#185438;--line:rgba(200,240,210,.15);--line-2:rgba(200,240,210,.28);--yellow:#ffe500;--yellow-2:#ffc800;--yellow-soft:#fff2a6;--ink:#f3f7ef;--muted:#a9cbb2;--dim:#7da38a;--good:#7ef0a6;--bad:#ff8070;--present:#5aa8ff;--absent:#123a26;--accent:#ffe500;--on-accent:#06200f;--hl:255,255,255;--bg-rgb:6,32,20;--panel-rgb:12,48,32;--h1a:#ffffff;--h1b:#cfe9d4;--shadow:0 18px 40px -18px rgba(0,0,0,.6);color-scheme:dark}
html[data-theme="pitch"] body::after{background:repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 80px,transparent 80px 160px)}
html[data-theme="sunset"]{--night:#fbeee2;--navy:#fffaf4;--navy-2:#f6e3d2;--navy-3:#ebcdb4;--line:rgba(70,30,20,.12);--line-2:rgba(70,30,20,.24);--yellow:#ffb400;--yellow-2:#f39a00;--yellow-soft:#6b3d00;--ink:#2b1a14;--muted:#6e4b3c;--dim:#7b5a4b;--good:#2a7236;--bad:#c0392b;--present:#3d6fe0;--absent:#ecd7c4;--accent:#b8461b;--on-accent:#2b1a14;--hl:70,30,20;--bg-rgb:251,238,226;--panel-rgb:255,250,244;--h1a:#2b1a14;--h1b:#b8461b;--shadow:0 18px 40px -24px rgba(90,40,20,.35);color-scheme:light}
html[data-theme="sunset"] body::after{background:radial-gradient(900px 500px at 85% -10%,rgba(255,150,40,.22),transparent 60%),radial-gradient(800px 600px at -10% 10%,rgba(200,70,30,.08),transparent 60%)}
html[data-theme="sky"]{--night:#eaf3fb;--navy:#ffffff;--navy-2:#e1edf8;--navy-3:#c6dbef;--line:rgba(13,40,80,.1);--line-2:rgba(13,40,80,.2);--yellow:#ffd400;--yellow-2:#f2b600;--yellow-soft:#5c4a00;--ink:#0d2340;--muted:#4a6283;--dim:#5b7292;--good:#12703f;--bad:#c4372b;--present:#1660b8;--absent:#d3e2f1;--accent:#1660b8;--on-accent:#0a1a30;--hl:13,40,80;--bg-rgb:234,243,251;--panel-rgb:255,255,255;--h1a:#0d2340;--h1b:#1660b8;--shadow:0 18px 40px -24px rgba(13,40,80,.3);color-scheme:light}
html[data-theme="sky"] body::after{background:radial-gradient(900px 500px at 85% -10%,rgba(120,180,240,.25),transparent 60%),radial-gradient(800px 600px at -10% 10%,rgba(255,212,0,.08),transparent 60%)}
html[data-theme="sunset"] .stand tr.fbrow td{background:rgba(255,170,40,.26)}html[data-theme="sky"] .stand tr.fbrow td{background:rgba(255,212,0,.28)}
html[data-theme="sunset"] .stand tr.fbrow .tm,html[data-theme="sky"] .stand tr.fbrow .tm{color:var(--ink)}
html[data-theme="sunset"] .nextup{background:linear-gradient(135deg,rgba(255,160,40,.26),rgba(255,160,40,.04) 60%),var(--navy)}
html[data-theme="sky"] .nextup{background:linear-gradient(135deg,rgba(255,212,0,.26),rgba(255,212,0,.04) 60%),var(--navy)}
html[data-theme="sunset"] .card,html[data-theme="sunset"] .box,html[data-theme="sunset"] .quiz,html[data-theme="sunset"] .stat,html[data-theme="sky"] .card,html[data-theme="sky"] .box,html[data-theme="sky"] .quiz,html[data-theme="sky"] .stat{background:var(--navy)}
html[data-theme="sunset"] .otd{background:rgba(255,160,40,.14);border-color:rgba(200,110,20,.35)}html[data-theme="sky"] .otd{background:rgba(255,212,0,.14);border-color:rgba(200,150,0,.35)}
html[data-theme="sunset"]{--c1:#a85a00;--c2:#1f5fbf;--c3:#9b2f6a;--c4:#1a7f63}
html[data-theme="sky"]{--c1:#a87e00;--c2:#1660b8;--c3:#c4511d;--c4:#1a8f72}

/* ===== look & feel ===== */
:root{--c1:#b88d00;--c2:#4f8fe6;--c3:#d0632f;--c4:#23977a;--br:#ffe500}
html[data-theme="day"],html[data-theme="retro"]{--c1:#a87e00;--c2:#1f5fbf;--c3:#c4511d;--c4:#1a8f72}
html[data-theme="canary"]{--c1:#1f5fbf;--c2:#b8441a;--c3:#7c4fb0;--c4:#00805a}
/* hero accent per branch */
.hero .stripes i:nth-child(odd){background:var(--br)}
.hero .scene{transition:box-shadow .4s}
.hero .scene .num{-webkit-text-stroke-color:color-mix(in srgb,var(--br) 60%,transparent)}
.hero .scene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--br);opacity:.85}
.scene svg .twinkle{animation:tw 3.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.scene svg .twinkle{animation:none}}
/* header search */
.hsearch{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:rgba(var(--panel-rgb),.6);color:var(--ink);font-family:var(--f-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;cursor:pointer}
.hsearch svg{width:18px;height:18px}
.hsearch:hover{border-color:var(--accent)}
@media (max-width:720px){.hsearch{width:42px;padding:0;justify-content:center}.hsearch span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
/* grouped tabs */
.tabs.grouped{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:0;background:none;border:0;border-radius:0;width:auto;overflow:visible}
.tgroups{display:flex;gap:6px;padding:6px;background:rgba(var(--panel-rgb),.75);border:1px solid var(--line);border-radius:999px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tg{background:none;border:0;padding:10px 20px;border-radius:999px;font-family:var(--f-label);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.tg:hover{color:var(--ink);background:rgba(var(--hl),.05)}
.tg[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.tsub{display:flex;gap:4px 18px;flex-wrap:wrap;padding:0 8px;max-width:100%}
.tsub .tab{padding:8px 2px;border-radius:0;font-size:14.5px;border-bottom:2px solid transparent;background:none!important;color:var(--muted)}
.tsub .tab:hover{color:var(--ink)}
.tsub .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
@media (max-width:560px){.tg{padding:9px 14px;font-size:14.5px}.tsub{gap:2px 14px}}
/* data labels */
.dchip{display:inline-block;vertical-align:middle;margin-inline-start:8px;padding:3px 9px;border-radius:999px;font-family:var(--f-label);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap;position:relative;top:-3px}
.dchip.real::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-inline-end:6px;vertical-align:1px}
.dchip.est{border-style:dashed}
.dchip.est::before{content:"≈";margin-inline-end:5px}
h3 .dchip,dd .dchip{top:0;font-size:10.5px}
/* club home */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:18px}
.hcard{display:flex;flex-direction:column;gap:12px;padding:20px;border-top:4px solid var(--br)}
.hcard .hhead{display:flex;gap:12px;align-items:flex-start}
.hcard h3{font-size:24px}
.hcard .hhead p{font-size:14px;margin-top:2px}
.hrows{display:grid;gap:10px;font-size:15px;margin:0}
.hrows dt{font-family:var(--f-label);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:-8px}
.hrows dd{margin:0}
.hrows .fo{display:inline-grid;place-items:center;width:22px;height:22px;font-size:12px;margin-inline-end:4px}
.hcard .btn{margin-top:auto;align-self:flex-start}
.hfx{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.hfrow{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-inline-start:4px solid var(--br)}
.hfrow .md{display:flex;flex-direction:column;font-size:14px}
.hfrow .md span{color:var(--muted)}
.hfrow .mm{display:flex;flex-direction:column;min-width:0}
.hfrow .mcomp{font-family:var(--f-label);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hfrow .mopp{font-weight:700}
.hfrow .mopp i{font-style:normal;color:var(--muted);font-weight:400;margin-inline-end:6px}
.hfrow .linkbtn{margin:0}
.hmore{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:22px;padding:20px}
@media (max-width:560px){.hfrow{grid-template-columns:80px 1fr}.hfrow .ms{grid-column:1/-1}}
/* charts */
.tlchart,.h2h{margin:0 0 22px;padding:18px 20px}
.tlchart figcaption,.szline figcaption{display:flex;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.clegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.clegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.clegend i.dash{height:0;border-top:2px dashed var(--muted);border-radius:0;vertical-align:3px;width:16px}
.s1{fill:var(--c1);background:var(--c1)}.s2{fill:var(--c2);background:var(--c2)}.s3{fill:var(--c3);background:var(--c3)}.s4{fill:var(--c4);background:var(--c4)}
.tlchart svg,.szline svg{width:100%;height:auto;display:block;overflow:visible}
.tlchart svg rect[class^="s"]:hover{opacity:.82}
svg .grid{stroke:var(--line);stroke-width:1}
svg .ax{fill:var(--muted);font-size:13px;font-family:var(--f-label)}
.tlchart details{margin-top:8px;font-size:14px}
.tlchart summary{cursor:pointer;color:var(--muted)}
.tlchart .tscroll{overflow-x:auto;margin-top:8px}
.tlchart .fine,.fine{font-size:13px;color:var(--muted);margin-top:6px}
html[dir="rtl"] .tlchart svg,html[dir="rtl"] .szline svg{direction:ltr}
.h2h{display:grid;gap:10px}
.h2hrow{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;font-size:15px}
.h2hrow .rbar{height:14px;margin:0}
.h2hnum{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
@media (max-width:560px){.h2hrow{grid-template-columns:1fr auto}.h2hrow .rbar{grid-column:1/-1;order:3}}
.szline{margin:4px 0 14px}
.szline .ln1{fill:none;stroke:var(--c1);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.szline .ln2{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:5 5;opacity:.75}
/* legend cards */
.legends2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.legend2{display:flex;flex-direction:column;padding:0;overflow:hidden}
.legend2 .lhead{display:flex;justify-content:space-between;gap:10px;padding:9px 16px;background:var(--accent);color:var(--on-accent);font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.legend2 .lyrs{opacity:.75;white-space:nowrap}
.legend2 .lbody{padding:16px 16px 6px;display:flex;flex-direction:column;gap:10px}
.lname{all:unset;cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1}
.lname:hover,.lname:focus-visible{color:var(--accent);text-decoration:underline;text-underline-offset:4px}
.lname:focus-visible,.pname:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.lkey{border-inline-start:3px solid var(--accent);padding:6px 12px;background:rgba(var(--hl),.05);border-radius:0 8px 8px 0;font-size:15px}
.legend2 .lfoot{padding:4px 16px 16px;margin-top:auto}
.legend2 .linkbtn{margin:0}
.pname{all:unset;cursor:pointer}
.pname:hover{color:var(--accent);text-decoration:underline}
/* overlay: player pages, search */
body.ovopen{overflow:hidden}
.ov{position:fixed;inset:0;z-index:90;background:rgba(var(--bg-rgb),.72);backdrop-filter:blur(4px);display:grid;place-items:start center;padding:6vh 16px 16px;overflow-y:auto}
.ov[hidden]{display:none}
.ovbox{position:relative;width:min(720px,100%);background:var(--navy);padding:26px 26px 22px;max-height:none}
.ovx{position:absolute;inset-inline-end:12px;top:12px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:none;color:var(--ink);cursor:pointer;font-size:16px}
.pp h2{font-size:clamp(30px,5vw,44px);margin:6px 0 14px;padding-inline-end:40px}
.ppfacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 18px}
.ppfacts div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ppfacts dt{font-family:var(--f-label);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ppfacts dd{margin:4px 0 0;font-weight:700}
.pp section{border-top:1px solid var(--line);padding:12px 0}
.pp section .mh{margin:0 0 6px}
.pp .lrole{font-family:var(--f-label);letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.pplist{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.pplist li{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pplist.links li{flex-direction:column;gap:0}
.pplist .linkbtn{margin:0;text-transform:none;letter-spacing:0;font-family:inherit;font-size:16px;text-align:start}
.srch h2{margin-bottom:12px}
.srch input{width:100%;font:inherit;font-size:18px;padding:12px 16px;border-radius:12px;border:1px solid var(--line-2);background:rgba(var(--bg-rgb),.5);color:var(--ink)}
.srch input:focus{outline:2px solid var(--accent);outline-offset:1px}
#sres section{margin-top:16px}
.sreslist{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:4px}
.sreslist button{all:unset;box-sizing:border-box;width:100%;display:flex;flex-direction:column;padding:9px 12px;border-radius:10px;cursor:pointer}
.sreslist button:hover,.sreslist button:focus-visible{background:rgba(var(--hl),.07);outline:none}
.sreslist button span{font-size:14px;color:var(--muted)}
.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
@media (max-width:560px){.ov{padding:0}.ovbox{min-height:100%;border-radius:0;padding:22px 16px}}

.hero[data-br="home"] h1{font-size:clamp(44px,7.2vw,100px)}
@media (max-width:560px){.hsearch{order:4;width:46px;height:46px;flex:none}.bar .picker{flex:1 1 calc(100% - 60px);flex-basis:calc(100% - 60px);min-width:0}}
.dchip{max-width:100%;white-space:normal}
html.lwait .hero,html.lwait main,html.lwait #panel{opacity:0}
/* ===== v13 ===== */
.scene .num{display:none}
/* records */
.recfacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}
.recfact{padding:18px 20px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--accent)}
.recfact .rv{font-family:var(--f-display);font-weight:900;font-size:44px;line-height:1;color:var(--accent)}
.recfact h3{font-size:19px}
.recfact p{font-size:15px;color:var(--muted)}
.reclists{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:20px}
.reclist{padding:18px 20px}
.reclist ol{list-style:none;padding:0;margin:10px 0 6px;display:grid;gap:2px}
.reclist li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.reclist .rk{color:var(--muted);font-variant-numeric:tabular-nums}
.reclist .nm{display:flex;flex-direction:column;min-width:0}
.reclist .nm small{color:var(--muted);font-size:13px}
.reclist li b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.srcs{margin-top:18px}.srcs a{color:inherit}
/* europe */
.eubar{display:flex;flex-direction:column;gap:10px;margin:18px 0 6px}
.eubar input{font:inherit;font-size:16px;padding:11px 14px;border-radius:12px;border:1px solid var(--line-2);background:rgba(var(--bg-rgb),.5);color:var(--ink);max-width:420px}
.eulist{display:grid;gap:12px;margin-top:12px}
.euseason{padding:14px 18px;overflow-x:auto}
.euseason h3{font-size:20px;margin-bottom:6px}
.eut{width:100%;border-collapse:collapse;font-size:15px;min-width:520px}
.eut th{text-align:start;font-family:var(--f-label);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.eut td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.eut td .label{font-size:11px}
.eut td small{display:block;color:var(--muted);font-size:13px}
.eut td.sc{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.eut .chip{margin-bottom:2px}
/* match pages */
.mclick{cursor:pointer}
.mrow.mclick:hover,.mrow.mclick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hrows dd.mclick{text-decoration:underline dotted;text-underline-offset:4px}
.mp .mpscore{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start;margin:14px 0 18px;text-align:center}
.mp .mpscore>div>b{font-size:20px;display:block}
.mp .mpscore .fb>b{color:var(--accent)}
.mp .mpres{display:flex;flex-direction:column;align-items:center;gap:6px}
.mp .mpres span:first-child{font-family:var(--f-display);font-weight:900;font-size:56px;line-height:1}
.mp .mpres em{font-style:normal;margin:0 6px;color:var(--muted)}
.scorers{list-style:none;padding:0;margin:8px 0 0;font-size:14px;display:grid;gap:2px}
.mpnav{justify-content:space-between}
/* calendar + ratings */
.calall{display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:18px 20px;margin-top:22px}
.rategrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px;margin-top:10px;max-height:330px;overflow:auto;padding-inline-end:4px}
.rategrid label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14.5px;border-bottom:1px solid var(--line);padding:4px 0}
.rategrid select{font:inherit;padding:4px 6px;border-radius:8px;background:rgba(var(--bg-rgb),.5);color:var(--ink);border:1px solid var(--line-2)}
.ratecard details{margin-top:10px}.ratecard summary{cursor:pointer;font-weight:700}
.tally.rates li small{color:var(--muted);font-size:12px;white-space:nowrap}
/* fan league */
.lggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.lggrid>.card{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.lgpred,.lgmine{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.lgpred li{display:flex;justify-content:space-between;align-items:center;gap:10px;border-inline-start:3px solid var(--br);padding:6px 0 6px 10px;flex-wrap:wrap}
.lgpred li>div:first-child{display:flex;flex-direction:column}
.lgin{display:flex;align-items:center;gap:6px}
.lgin input{width:54px;font:inherit;font-size:16px;text-align:center;padding:7px 4px;border-radius:10px;border:1px solid var(--line-2);background:rgba(var(--bg-rgb),.5);color:var(--ink)}
.lgmine li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.lgmine li .muted{grid-column:1;font-size:14px}.lgmine li b{grid-row:1/3;grid-column:2;align-self:center}
.lgmine b.good{color:var(--good)}
/* challenges, season extras, career */
.chbox{padding:16px 20px;margin:16px 0;border-inline-start:4px solid var(--accent)}
.chbox h3{font-family:var(--f-display);font-size:30px;letter-spacing:.04em}
.chrow{align-items:center}

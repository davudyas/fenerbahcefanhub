@media (max-width:560px){.mcentre .hfrow .ms,.hpane .hfrow.mclick .ms{grid-column:auto}.mcentre .hfrow .mopp,.hpane .hfrow.mclick .mopp{font-size:14.5px}}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.tourbtn{display:flex;width:fit-content;align-items:center;gap:8px;margin-top:12px;padding:7px 14px 7px 10px;border-radius:999px;border:1px dashed var(--line-2);background:rgba(var(--hl),.03);color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.tourbtn svg{width:18px;height:18px;color:var(--accent);flex:none}
.tourbtn:hover{border-style:solid;border-color:var(--accent)}

body:not([data-view="home"]) #tourBtn{display:none}
.hero .tourbtn{margin-bottom:12px}
.mphl .btns{margin-top:6px}
.hlbtn{display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.hlbtn svg{width:20px;height:20px;flex:none}

/* ===== v21: a calmer look. Loaded last. =====
   Rules: yellow only for Fenerbahçe's name, scores and the main button on a screen; flat tinted cards; sentence case
   (capitals only for the wordmark and the page title); one spacing scale (4 / 8 / 12 / 16 / 24 / 32); three text sizes
   for headings. */
:root{--f-label:var(--f-body);--card:rgba(var(--hl),.045);--card-2:rgba(var(--hl),.08);--gap:16px;--r:14px}

/* 3. sentence case everywhere except the wordmark and the page title */
body *{text-transform:none!important;letter-spacing:normal!important}
.brand b,.hero h1{text-transform:uppercase!important;letter-spacing:.01em!important}

/* 1. decoration off: striped bars, glows, gradient text, textured background */
.bar::after,footer::before,.panel h2::before,.gamearea>h2::before,.stripes,.stat::before,.game::after,.otd::before{display:none!important}
body::after{background:none!important}
.bar{border-bottom:1px solid var(--line)}
.hero h1{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ink)}
.eyebrow{color:var(--muted);font-weight:600;font-size:14px}
.select-wrap select{background:var(--card-2);color:var(--ink);box-shadow:none;font-weight:600;font-size:16px;border:1px solid var(--line-2)}
.select-wrap::after{border-color:var(--ink)}
.btn{background:var(--yellow);box-shadow:none!important;font-weight:600;font-size:15px}
.btn:hover:not(:disabled){transform:none;filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)!important}
.btn.ghost:hover:not(:disabled){color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)!important}
.linkbtn{font-weight:600;font-size:14.5px}
.otd{background:var(--card);border:0}
.otd strong{color:var(--ink)}
.stat .v,.count,.mstat b,.trophy .count,.ovr .big,.final{color:var(--ink)}
.timeline .yr{color:var(--ink)}
.timeline li::before{border-color:var(--line-2)}
.timeline::before{background:var(--line)}
.legend .mono{background:var(--card-2)}
.legend .mono::after{display:none}
.legend .role{color:var(--muted)}
.cups svg path{fill:var(--muted)}
.chip{background:var(--card-2);color:var(--ink);font-weight:600}
.chip.win{background:var(--card-2);color:var(--ink)}
.dchip{display:none}

/* 2. flat cards: a soft tint instead of border + shadow + gradient */
.card,.box,.quiz,.stat,.lcard,.hfrow,.mrow,.nextup,.formcard,.game,.legend,.trophy,.branch,.qlv,.wstats,.hint,.cand2,.opt,.takers li,.clues li,.tl2 li.card,.setpanel .seg,.htabs,.pgroups,.tgroups,.empty{
  background:var(--card)!important;border:0!important;box-shadow:none!important}
.card,.box,.quiz,.game,.legend,.trophy,.branch,.nextup,.formcard{border-radius:var(--r)}
.lcard:hover,.hfrow.mclick:hover,.mrow.mclick:hover,.hline:hover{background:var(--card-2)!important;transform:none}
.lcard[aria-pressed="true"],.lcard[aria-selected="true"]{background:var(--ink)!important;color:var(--night)}
.lcard[aria-pressed="true"] span,.lcard[aria-selected="true"] span{color:inherit;opacity:.75}
.opt.right{background:color-mix(in srgb,var(--good) 18%,transparent)!important}
.opt.wrong{background:color-mix(in srgb,var(--bad) 16%,transparent)!important}
.empty{border:0!important}
.setpanel{border:1px solid var(--line-2);box-shadow:0 14px 40px rgba(0,0,0,.35)}
.tourcard{border:0}

/* 8. headings: page title, section title, small heading */
.panel>h2,.panel h2.ph,.gamearea>h2{font-family:var(--f-body);font-weight:700;font-size:clamp(24px,3vw,30px);line-height:1.15;margin-bottom:4px}
.box h3,.legend h3,.trophy h3,.branch h3,.game .team,.timeline h3,.hcard h3,.quiz h3,.mp h3{font-family:var(--f-body);font-weight:600;font-size:18px;line-height:1.3}
.mh{font-family:var(--f-body);font-weight:600;font-size:15px;color:var(--muted);margin:24px 0 8px}
.label{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}
.panel .intro{font-size:15.5px;margin-top:4px}
.panel{padding-block:24px 64px}
.panel>*+*{margin-top:var(--gap)}
.panel>h2+.intro{margin-top:4px}
.mtop,.mcols,.mcentre,.games,.legends,.cabinet,.branches{gap:var(--gap)}
.nx-teams{font-family:var(--f-body);font-weight:700;font-size:clamp(24px,3.2vw,34px);line-height:1.15;margin:8px 0 12px}
.mcnext .nx-teams{font-size:clamp(24px,3.2vw,34px)}
.nx-teams .vs{font-size:14px;font-weight:500}
.nx-teams .fb,.game .team.fb,.mpscore .fb b,.scoreboard .tm:first-child{color:var(--accent)}
.game .title{font-family:var(--f-body);font-weight:700;font-size:22px;color:var(--ink)}
.game .res{font-size:40px}
.game .where{border-top:1px solid var(--line)}

/* 4. one row of sections, with a few small links under Standings and Club */
.tabs.grouped,#tabs{margin-top:20px}
.tgroups{background:none!important;padding:0;border-radius:0;gap:4px;border-bottom:1px solid var(--line)!important;width:100%}
.tg{font-family:var(--f-body);font-weight:600;font-size:16px;padding:12px 16px;border-radius:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted)}
.tg:hover{background:none;color:var(--ink)}
.tg[aria-selected="true"]{background:none;color:var(--ink);border-bottom-color:var(--accent)}
.tg .ball{display:none}
.tsub{padding:10px 0 0;gap:6px 6px}
.tsub .tab{font-family:var(--f-body);font-weight:500;font-size:14.5px;padding:6px 12px;border:0;border-radius:999px;color:var(--muted)}
.tsub .tab[aria-selected="true"]{background:var(--card-2)!important;color:var(--ink)}
.pgroups,.htabs{background:none!important;padding:0;border-radius:0!important;gap:4px;border-bottom:1px solid var(--line)!important;width:100%}
.pgroups button,.htabs button{font-family:var(--f-body);font-weight:600;font-size:15px;padding:10px 14px;border-radius:0;border-bottom:2px solid transparent;margin-bottom:-1px}
.pgroups button[aria-selected="true"],.htabs button[aria-selected="true"]{background:none;color:var(--ink);border-bottom-color:var(--accent)}
.pgroups small{background:var(--card-2)}
.pgroups button[aria-selected="true"] small{background:var(--card-2)}
.filter button{font-family:var(--f-body);font-weight:500;font-size:14px;border:0;background:var(--card)}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--night)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--night)}

/* 5. fine print once: the date under the title, sources behind a toggle */
.asof{font-size:13px;color:var(--dim);margin-top:6px}
.srcs{margin-top:32px;font-size:13.5px;color:var(--dim)}
.srcs summary{cursor:pointer;width:max-content;color:var(--muted)}
.srcs summary:hover{color:var(--ink)}
.srcs .fine{margin-top:8px}
.fine.src{border-top:0;padding-top:0}
.livenote{font-size:13.5px}
.livenote .ln-dot{margin-top:5px}

/* 6. calmer result rows: no coloured edges; a dot for the result; a small sport icon in mixed lists */
.mrow,.mrow.W,.mrow.L,.mrow.fx,.hfrow{border-left:0!important;border-inline-start:0!important}
.mcnext{border-inline-start:0!important}
.rdot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.rdot.W{background:var(--good)}.rdot.L{background:var(--bad)}.rdot.D{background:var(--dim)}
.ms{display:flex;align-items:center;gap:10px}
.mrow .sc,.hfrow .ms b{font-family:var(--f-body);font-weight:700;font-size:18px;color:var(--ink)}
.mrow .sc em{font-style:normal;color:var(--dim);margin:0 2px}
.mcomp{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.mcomp[class*="c-"]{background:none!important;color:var(--muted)!important;padding:0!important}
.bri{width:16px;height:16px;flex:none;color:var(--muted)}
.mopp{font-weight:600}
.mopp i{font-style:normal;color:var(--dim);font-weight:500;margin-inline-end:6px}
.md b{font-weight:600}
.fo{width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:700;box-shadow:none!important}
.fo.W{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}
.fo.D{background:var(--card-2);color:var(--muted)}
.fo.L{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.mcafter li .bri{vertical-align:-3px;margin-inline-start:6px}

/* 7. home: one compact line per team */
.hlines{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hline{width:100%;display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(0,1.3fr) minmax(0,1.3fr) 16px;gap:12px;align-items:center;text-align:start;padding:12px 16px;border:0;border-radius:var(--r);background:var(--card);color:var(--ink);font:inherit;font-size:14.5px;cursor:pointer}
.hl-br{display:flex;align-items:center;gap:8px;min-width:0}.hl-br b{font-weight:600;font-size:15px}
.hl-br .bri{width:18px;height:18px;color:var(--ink)}
.hl-last{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl-last b{font-weight:700}.hl-last i{font-style:normal;color:var(--dim)}
.hl-next{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl-go{color:var(--dim);font-size:20px;line-height:1}
.hmore{margin-top:var(--gap)}
.hmore h3{font-family:var(--f-body);font-size:17px;font-weight:600}
body[data-view="home"] #panel>h2:not(.vh),body[data-view="home"] #panel>.intro{display:none}
.htabs{margin-top:8px}
@media (max-width:700px){
  .hline{grid-template-columns:minmax(0,1fr) 16px;grid-template-areas:"br go" "last go" "next go";gap:4px 10px;padding:12px 14px}
  .hl-br{grid-area:br}.hl-last{grid-area:last}.hl-next{grid-area:next;font-size:13.5px}.hl-go{grid-area:go}
}
@media (max-width:560px){
  .tg{padding:10px 10px;font-size:15px}
  .tgroups{overflow-x:auto}
  .panel>h2,.panel h2.ph{font-size:24px}
  .pgroups{display:flex!important;overflow-x:auto}
  .pgroups button{white-space:nowrap!important;min-height:0;padding:10px 10px;font-size:14px}
  .htabs{display:flex!important}.htabs button{flex:1;padding:10px 6px}
}
.hero h1{font-size:clamp(38px,4.6vw,66px)}
.nextup .label,.mcafter .label,.tlcur .label{color:var(--muted)}
.linkbtn{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px}
.linkbtn:hover{text-decoration-color:var(--ink)}
.cal a,.calmini a:hover{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.fine a{color:var(--muted)}
.recfact .rv{font-family:var(--f-body);font-weight:700;font-size:36px;color:var(--ink)}
.raceodds b{font-family:var(--f-body);font-weight:700;color:var(--ink)}
.racerest summary,.qtadj{color:var(--ink)!important}
.qlv .qdots{color:var(--muted)}
.cand2 .r,.stat .v{font-family:var(--f-body);font-weight:700}
.legend .mono span{font-family:var(--f-body);font-weight:700;font-size:56px;text-shadow:none;color:var(--muted)}
@media (max-width:560px){.tgroups{gap:0}.tg{padding:10px 9px;font-size:14.5px}}
@media (max-width:380px){.tg{padding:10px 7px;font-size:14px}}

/* ===== v22: first-visit polish ===== */
/* 2. home: the logo already says Fenerbahçe, so the big title steps back and the matches move up */
body[data-view="home"] .hero h1{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}
body[data-view="home"] .hero .scene{display:none}
body[data-view="home"] .hero .wrap{grid-template-columns:minmax(0,1fr);padding-block:20px 6px}
body[data-view="home"] .hero .nick{font-style:normal;font-weight:700;font-size:clamp(24px,3vw,32px);color:var(--ink);line-height:1.2;margin-top:4px}
body[data-view="home"] .hero .lede{max-width:72ch}
body[data-view="home"] .home{display:none}
/* 4. one scrolling home page */
.hsec{margin-top:32px;scroll-margin-top:90px}
.hsec>.mh:first-child{margin-top:0}
#hs-predict .league{margin-top:0}
.mcentre{margin-bottom:8px}
/* 5. play teaser */
.hplay{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.hpcard{display:flex;flex-direction:column;gap:2px;text-align:start;padding:14px 16px;border:0;border-radius:var(--r);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.hpcard b{font-weight:700;font-size:16px}.hpcard span{font-size:13.5px;color:var(--muted)}
.hpcard:hover{background:var(--card-2)}
/* 6. header: search, branch, language, settings (the design picker lives in Settings) */
.themepick{display:none!important}
/* 7. phones: trophy numbers as a tidy grid, result rows on one line where they fit */
@media (max-width:560px){
  .stats{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible;margin-inline:0;padding-inline:0;gap:6px}
  .stat{padding:8px 10px;gap:6px}.stat .v{font-size:20px}.stat .k{font-size:12px}
  .hfrow .mopp,.mrow .mopp{font-size:15px;line-height:1.25}
  .hplay{grid-template-columns:repeat(2,minmax(0,1fr))}

}
/* 8. about this site */
footer .wrap{flex-direction:column;align-items:flex-start;gap:6px}
footer .about{max-width:70ch;color:var(--muted)}
@media (max-width:560px){.hsec .hfrow{grid-template-columns:58px minmax(0,1fr) auto;gap:10px;padding:10px 12px}.hsec .hfrow .ms{grid-column:auto;display:flex;align-items:center;white-space:nowrap}.hsec .hfrow .linkbtn{font-size:13.5px}}

/* ===== v23: Matchday layout ===== */
/* Light: grey page, white cards, a navy band for the header and the page title, yellow as the accent */
html[data-theme="light"],html[data-theme="light"] .setpanel,html[data-theme="light"] .tourcard{--night:#eef1f6;--navy:#ffffff;--navy-2:#f3f5f9;--navy-3:#dde3ee;--line:rgba(16,24,40,.08);--line-2:rgba(16,24,40,.16);
  --yellow:#ffd500;--yellow-2:#ffd500;--yellow-soft:#6b5300;--ink:#121826;--muted:#566176;--dim:#7f8aa1;--good:#12844c;--bad:#cf3a2e;--present:#3d6fe0;--absent:#dfe4ec;
  --accent:#173c8f;--on-accent:#0b1736;--hl:16,24,40;--bg-rgb:238,241,246;--panel-rgb:255,255,255;--h1a:#fff;--h1b:#fff;--card:#ffffff;--card-2:#f3f5f9;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);color-scheme:light}
html[data-theme="light"] body{background:#eef1f6}
/* navy islands: header band, page-title band, phone bar */
html[data-theme="light"] .bar,html[data-theme="light"] .hero,html[data-theme="light"] .bnav{--ink:#ffffff;--muted:#b8c4df;--dim:#8f9dc0;--hl:255,255,255;--line:rgba(255,255,255,.12);--line-2:rgba(255,255,255,.24);
  --card:rgba(255,255,255,.08);--card-2:rgba(255,255,255,.15);--accent:#ffd500;--bg-rgb:13,28,61;--panel-rgb:21,41,86;--night:#0d1c3d;color:#fff}
html[data-theme="light"] .bar{background:#0d1c3d;border-bottom:0}
html[data-theme="light"] .hero{background:linear-gradient(180deg,#0d1c3d,#12285a)}
html[data-theme="light"] .hero .scene{border-color:rgba(255,255,255,.14)}
html[data-theme="light"] .card,html[data-theme="light"] .mcard,html[data-theme="light"] .hline,html[data-theme="light"] .hpcard{box-shadow:var(--shadow)!important}
html[data-theme="light"] .hero .card,html[data-theme="light"] .hero .stat{box-shadow:none!important}
html[data-theme="light"] .nx-teams .fb,html[data-theme="light"] .tl.fb .tn{color:var(--accent)}
html[data-theme="light"] .btn{color:#0b1736}
html[data-theme="light"] .stand tr.fbrow td{background:rgba(23,60,143,.07)}
html[data-theme="light"] .stand tr.fbrow .tm{color:#173c8f}

/* ---------- Score strip ---------- */
.strip{background:var(--card);border-bottom:1px solid var(--line)}
html[data-theme="light"] .strip{background:#fff}
.strack{display:flex;gap:0;overflow-x:auto;scrollbar-width:thin;scroll-snap-type:x proximity;margin-inline:-8px}
.strack::-webkit-scrollbar{height:4px}.strack::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:2px}
.stile{flex:0 0 auto;width:146px;display:grid;gap:2px;padding:8px 12px;border:0;border-inline-end:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:start;cursor:pointer;scroll-snap-align:start}
.stile:hover{background:var(--card-2)}
.stc{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}.stc span{overflow:hidden;text-overflow:ellipsis}
.stc .bri{width:12px;height:12px}
.sts{font-size:11px;color:var(--dim);white-space:nowrap}
.str{display:flex;align-items:center;gap:6px;font-size:13px}.str .sn{flex:1;font-weight:600}.str b{font-weight:700;min-width:2ch;text-align:end}
.str.fb .sn{color:var(--accent)}
.str .tb{width:18px;height:18px;font-size:7.5px}
.ssep{flex:0 0 3px;background:var(--accent);margin:8px 0;border-radius:2px;opacity:.6}

/* ---------- Header band: brand, search, language, settings; then every branch as an icon tab ---------- */
.picker{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);opacity:0;pointer-events:none}
.bar .wrap{padding-block:10px}
.brrow{border-top:1px solid var(--line)}
.brrow .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:0}
.brrow .wrap::-webkit-scrollbar{display:none}
.brrow button{flex:none;display:flex;align-items:center;gap:7px;padding:10px 12px 11px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.brrow button .bri{width:18px;height:18px;color:currentColor}
.brrow button:hover{color:var(--ink)}
.brrow button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--yellow)}
.bar .brand b{font-size:24px}

/* ---------- Page-title band, with the section tabs at its foot ---------- */
.hero .wrap{padding-block:22px 14px}
.herotabs{padding-block:0!important}
.herotabs .tabs{margin:0!important}
.herotabs .tgroups{border-bottom:0!important}

.hero .stats{margin-top:16px}
.hero .home{padding-top:10px}
.hero .stat{background:var(--card)!important}
.panel{padding-top:20px}

/* ---------- Cards with a title row ---------- */
.mcard{padding:16px 18px;border-radius:var(--r)}
.mch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.mch h3{font-family:var(--f-body);font-weight:700;font-size:17px;margin:0}
.mch .linkbtn{text-decoration:none;font-size:14px;color:var(--accent)}
.mch .filter{margin:0}
.mcard>.filter{margin:0 0 10px}

/* ---------- Stacked match rows ---------- */
.srows{list-style:none;margin:0;padding:0;display:block}
.srow{display:grid!important;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px!important;border:0!important;border-top:1px solid var(--line)!important;border-radius:0!important;background:none!important;box-shadow:none!important}
.srows>.srow:first-child{border-top:0!important}
.srow.mclick,.srow[data-gosport]{cursor:pointer}
.srow.mclick:hover,.srow[data-gosport]:hover{background:var(--card-2)!important}

function bClues(x,b){const app=x.apps.length?x.apps[Math.floor(Math.random()*x.apps.length)]:null,sq=x.squads.length?x.squads[Math.floor(Math.random()*x.squads.length)]:null;

    :sq?`I ${sq.num?`wore number ${sq.num}`:"was"} in the ${sq.S.label.toLowerCase()} squad${sq.as!==x.n?` (listed as ${sq.as})`:""}.`:`My Fenerbahçe years: ${x.ten}.`;
  let c2;
  if(app){const ids=[...new Set(x.apps.map(a=>a.L.label))];c2=ids.length>1?`I appear in ${ids.length} of these box scores: ${ids.join(", ")}.`:"That's my only appearance in these box scores.";if(x.ten)c2+=` My Fenerbahçe years: ${x.ten}.`}

  const sp=SPECIAL_B[x.n]||VB_AWARDS[x.n]||(sq&&VB_AWARDS[sq.as])||"",pn=`I'm a ${BPOS[x.pos]}${x.nat?` from ${NAT2[x.nat]}`:""}.`;
  if(!app&&!sq)return [c1,sp||`I played as a ${BPOS[x.pos]}.`,x.nat?`I'm from ${NAT2[x.nat]}${sp?` and I played as a ${BPOS[x.pos]}`:""}.`:`I played as a ${BPOS[x.pos]}.`,`My initials are ${initialsOf(x.n)}`];

const WHOCFG={
 football:()=>{const seasonPool=Object.values(PEOPLE).filter(x=>x.seasons.length),legends=Object.values(PEOPLE).filter(x=>!x.seasons.length&&x.p&&x.p.from<2000);

     <div class="btns">${w.shown<4?`<button class="btn ghost" data-wh="more">Next clue (−1)</button>`:""}<button class="btn ghost" data-wh="give">Give up</button></div><p class="gnote">Worth ${pts} point${pts>1?"s":""} right now.${w.guesses.length?` Tried: ${w.guesses.map(esc).join(", ")}`:""}</p>`}</div>`;

function branchDeck(b,extra){const ev=[],seen=new Set(),add=(y,t,s)=>{if(!seen.has(t)){seen.add(t);ev.push({y,t,s})}},S=SPORTS[b];
  (S.history||[]).forEach(([y,t])=>{if(/^\d{4}$/.test(y))add(+y,t,"History")});(S.games||[]).forEach(g=>add(+g.date.slice(0,4),g.res?`${g.home} ${g.res} ${g.away} (${g.comp})`:`${g.title} (${g.comp})`,"Big games"));
  extra.forEach(([y,t,s])=>add(y,t,s));return shuffle(ev)}

const tlS={};
function tlNext(tl){const D=tl.deck;if(!D.length)return null;const ys=tl.placed.map(e=>e.y);let bi=0,bs=1e9;
  for(let i=0;i<Math.min(D.length,18);i++){const d=Math.min(...ys.map(y=>Math.abs(y-D[i].y))),sc=d===0?6:d<=3?d:10+d;if(sc<bs){bs=sc;bi=i}}return D.splice(bi,1)[0]}
function newTL(b,expert){const deck=TLCFG[b].deck(),prev=tlS[b],tl={b,deck,placed:[deck.shift()],lives:2,score:0,last:null,over:false,expert:expert!=null?expert:(prev?prev.expert:false),moves:0};tl.cur=tlNext(tl);tlS[b]=tl;return tl}

const SLOTNAME={GK:"goalkeeper",DF:"defender",MF:"midfielder",FW:"forward","6TH":"sixth man",PG:"point guard",SG:"shooting guard",SF:"small forward",PF:"power forward",C:"center",S:"setter",OP:"opposite",OH:"outside hitter",MB:"middle blocker",L:"libero"};
const tdS={};

const tdEff=(sp,p)=>p.r-(sp==="6TH"||p.pos===sp?0:3);
function tdInfo(C,picks){const idx=picks.map((p,i)=>p?i:-1).filter(i=>i>=0),eff=picks.map((p,i)=>p?tdEff(C.slots[i][0],p):null);if(!idx.length)return{eff,ovr:0};
  const w=i=>C.slots[i][0]==="6TH"?.5:C.slots[i][0]==="L"?.7:1;let sw=0,s=0;idx.forEach(i=>{s+=eff[i]*w(i);sw+=w(i)});return{eff,ovr:s/sw}}
function newTD(b){const C=TDCFG[b];tdS[b]={picks:Array(C.slots.length).fill(null),offers:{},active:0,rerolls:3,phase:"pick",cup:null};return tdS[b]}
function tdOffers(C,s,i){return chWith(current,"rd",()=>tdOffersRaw(C,s,i))}
function tdOffersRaw(C,s,i){const used=new Set(s.picks.filter(Boolean));if(!s.offers[i]){const sp=C.slots[i][0],nat=shuffle(C.pool.filter(p=>!used.has(p)&&(sp==="6TH"?p.pos!=="L":p.pos===sp))),alt=sp==="6TH"?[]:shuffle(C.pool.filter(p=>!used.has(p)&&p.pos!==sp&&p.alt.includes(sp)));
  const list=nat.slice(0,4);if(alt.length)list.push(alt[0]);else if(nat[4])list.push(nat[4]);s.offers[i]=shuffle(list)}return s.offers[i].filter(p=>!used.has(p))}




function gTeamDraft(el){const b=current,C=TDCFG[b];let s=tdS[b]||newTD(b);const info=tdInfo(C,s.picks),filled=s.picks.filter(Boolean).length,best=store.get(SK(b,"td"),null);
  const vis=`<div class="court ${C.court}">${C.court==="bb"?courtBB():C.court==="fb"?courtFB():courtVB()}${C.slots.map(([sp,x,y],i)=>{const p=s.picks[i],oop=p&&sp!=="6TH"&&p.pos!==sp;
    return `<button type="button" class="ps ${p?"filled":""} ${s.phase==="pick"&&s.active===i?"active":""} ${oop?"oop":""} ${sp==="6TH"||sp==="L"?"extra":""}" style="left:${x}%;top:${y}%" data-ts="${i}" aria-label="${SLOTNAME[sp]}${p?": "+esc(p.n):", empty"}"><span class="disc">${p?info.eff[i]:(sp==="6TH"?"6th":sp)}</span><span class="nm">${p?esc(p.short):""}</span></button>`}).join("")}</div>`;

    <div class="cands2">${tdOffers(C,s,i).map((c,k)=>`<button class="cand2" data-tc="${k}"><span class="r">${c.r}</span><span class="info"><b>${esc(c.n)}</b><small>${c.nat||""} · ${c.pos}${c.ten?` · ${esc(c.ten)}`:""}</small></span>${sp!=="6TH"&&c.pos!==sp?'<em class="tag bad">Out of position −3</em>':'<span></span>'}</button>`).join("")}</div>

  else side=`<div class="box" id="tdCup"></div>`;
  const sum=`<div class="box"><span class="label">${s.phase==="pick"?"Team so far":"Your team"}</span><div class="ovr" style="margin-top:8px"><span class="big">${filled?info.ovr.toFixed(1):"–"}</span><dl><dt>Players</dt><dd>${filled}/${C.slots.length}</dd><dt>Best ever</dt><dd>${best!=null?Number(best).toFixed(1):"–"}</dd><dt>Most trophies in a season</dt><dd>${store.get(SK(b,"sz-best"),0)}</dd></dl></div></div>`;
  el.innerHTML=`<h2>${C.unit==="eleven"?"XI Draft":C.unit==="five"?"Starting Five Draft":"Starting Six Draft"}</h2><p class="intro">${C.unit==="eleven"?"Fill a 4-3-3 from Fenerbahçe players, a few options at a time. Playing someone out of position costs 3 points.":C.unit==="five"?"Fill a starting five and a sixth man from Fenerbahçe greats, five options at a time. Playing someone out of position costs 3 points.":"Fill a starting six plus a libero from Fenerbahçe greats, five options at a time. Playing someone out of position costs 3 points."} Then pick a season and play it through, game by game, in every competition the club entered that year.</p>
  <div class="draft"><div>${vis}</div><div class="side">${side}${sum}</div></div><p class="gnote">Ratings are fan ratings made for this game, not official numbers.</p>`;
  el.querySelectorAll("[data-ts]").forEach(x=>x.onclick=()=>{const i=+x.dataset.ts;if(s.phase==="pick"&&!s.picks[i]){s.active=i;rerender()}});
  el.querySelectorAll("[data-tc]").forEach(x=>x.onclick=()=>{s.picks[s.active]=tdOffers(C,s,s.active)[+x.dataset.tc];const nx=s.picks.findIndex(p=>!p);
    if(nx<0){s.phase="done";const o=tdInfo(C,s.picks).ovr,bs=store.get(SK(b,"td"),null);if(bs==null||o>bs)store.set(SK(b,"td"),Math.round(o*10)/10);s.cup={}}else s.active=nx;rerender()});
  const rr=el.querySelector('[data-t="reroll"]');if(rr)rr.onclick=()=>{if(!s.rerolls)return;s.rerolls--;delete s.offers[s.active];rerender()};
  if(s.phase==="done")tdCupRender(b)}

const FT_DEF={basketball:["Bogdan Bogdanović","Luigi Datome","Kostas Sloukas","Nando De Colo","Nigel Hayes-Davis","Marko Gudurić"],"womens-basketball":["Kayla McBride","Diana Taurasi","Breanna Stewart","Emma Meesseman","Julie Allemand","Kelsey Plum"]};
const ftS={};let ftRAF=null;
function ftPool(b){const C=TDCFG[b],s=tdS[b],P=C.pool,def=FT_DEF[b].map(n=>P.find(p=>p.n===n)).filter(Boolean);if(s&&s.picks.every(Boolean))return s.picks.concat(def.filter(d=>!s.picks.includes(d))).slice(0,9);return def}
function newFT(b,shooter){ftS[b]={shooter,shots:[],streak:0,score:0,phase:shooter?"aim":"pick",t0:performance.now(),val:0,res:null,anim:null};return ftS[b]}
const ftZone=s=>Math.max(3,6+(s.shooter.r-75)*.5-s.streak*.9),ftPer=s=>Math.max(520,1150-s.streak*55);
function ftLoop(){const s=ftS[current];if(!s||s.phase!=="aim"){ftRAF=null;return}const m=document.getElementById("ftMark");if(!m){ftRAF=null;return}const t=performance.now()-s.t0,per=ftPer(s),ph=(t%(2*per))/per;s.val=(ph<1?ph:2-ph)*100;m.style.left=s.val+"%";ftRAF=requestAnimationFrame(ftLoop)}
function ftShoot(){const b=current,s=ftS[b];if(!s||s.phase!=="aim")return;const d=Math.abs(s.val-50),w=ftZone(s);let r;
  if(d<=w*.4)r=["Swish!",3,true];else if(d<=w)r=["Good!",2,true];else if(d<=w+4)r=Math.random()<.45?["Rolled in!",1,true]:["Rim out!",0,false];else r=s.val<50?["Short!",0,false]:["Long!",0,false];
  s.phase="anim";s.res=r;s.anim={t0:performance.now(),make:r[2],kind:r[0],side:s.val<50?-1:1};rerender();
  setTimeout(()=>{s.shots.push(r[2]);s.score+=r[1]*(r[2]&&s.streak>=4?2:1);s.streak=r[2]?s.streak+1:0;if(s.shots.length>=10){s.phase="over";const k=SK(b,"ft"),bs=store.get(k,0);if(s.score>bs){store.set(k,s.score);s.rec=true}}else{s.phase="aim";s.t0=performance.now()}rerender()},1250)}

    <span class="label">Choose your shooter${tdS[b]&&tdS[b].picks.every(Boolean)?" · your drafted team is listed first":""}</span><div class="shooters">${ftPool(b).map((p,i)=>`<button class="cand2" data-fs="${i}"><span class="r">${p.r}</span><span class="info"><b>${esc(p.n)}</b><small>${p.pos} · ${p.nat||""}</small></span><span></span></button>`).join("")}</div><p class="gnote">Best score: ${store.get(SK(b,"ft"),0)}. Shooter ratings are made up for this game.</p>`;
    el.querySelectorAll("[data-fs]").forEach(x=>x.onclick=()=>{newFT(b,ftPool(b)[+x.dataset.fs]);rerender()});return}
  const w=ftZone(s),dots=s.shots.map(v=>`<i class="dot ${v?"g":"m"}"></i>`).join("")+Array(10-s.shots.length).fill('<i class="dot"></i>').join("");
  el.innerHTML=`<h2>Free Throws</h2><p class="intro">Stop the marker in the yellow zone. Tap the court, press Space, or use the button.</p>
  <div class="pk-wrap"><div><div class="ftcourt" id="ftc"><svg viewBox="0 0 400 260" aria-hidden="true"><rect x="0" y="232" width="400" height="28" class="floor"/><rect x="352" y="40" width="8" height="110" class="board"/><rect x="330" y="72" width="22" height="26" class="board2"/><path d="M300 100 H352" class="rim"/><path d="M302 100 L310 128 H342 L350 100" class="net2"/>
    <circle cx="70" cy="196" r="26" class="shooter"/><text x="70" y="202" text-anchor="middle" class="shnum">${esc(String(s.shooter.r))}</text><circle id="ftBall" cx="96" cy="176" r="10" class="ball"/></svg>
    ${s.res&&s.phase!=="aim"?`<div class="pk-banner" style="top:8%">${esc(s.res[0])}</div>`:""}</div>
    <div class="meter"><div class="zone" style="left:${50-w}%;width:${2*w}%"></div><div class="zone in" style="left:${50-w*.4}%;width:${.8*w}%"></div>${s.phase==="aim"?`<div class="mark" id="ftMark" style="left:${s.val}%"></div>`:""}</div></div>
  <div class="side"><div class="box"><span class="label">${s.phase==="over"?"Finished":`Shot ${s.shots.length+1} of 10`}</span><h3 style="margin-top:4px">${esc(s.shooter.n)}</h3>
    <div class="xinums"><div><b class="count">${s.score}</b><span class="label">points</span></div><div><b class="count">${s.streak}</b><span class="label">in a row</span></div></div>

  el.querySelector("#ftc").onpointerdown=e=>{if(s.phase==="aim"){e.preventDefault();ftShoot()}};

    const end=A.make?[326,104]:A.kind==="Short!"?[296,110]:A.kind==="Long!"?[352,92]:[302,98];
    const step=now=>{const k=Math.min(1,(now-A.t0)/(reduce?200:820)),x0=96,y0=176,cx=210,cy=-30;const t=k,x=(1-t)*(1-t)*x0+2*(1-t)*t*cx+t*t*end[0],y=(1-t)*(1-t)*y0+2*(1-t)*t*cy+t*t*end[1];
      if(ball){ball.setAttribute("cx",x);ball.setAttribute("cy",y)}if(k<1&&ball&&ftS[current]===s)requestAnimationFrame(step);else if(ball){const fy=A.make?150:200,fx=A.make?326:(A.kind==="Long!"?380:270);setTimeout(()=>{ball.style.transition="cx .35s, cy .35s";ball.setAttribute("cx",fx);ball.setAttribute("cy",fy)},60)}};

const SV_DEF=["Melissa Vargas","Kim Yeon-koung","Katarzyna Skowrońska","Magdalena Stysiak","Arina Fedorovtseva","Eda Erdem Dündar"];
const svS={};let svRAF=null;
const svX=x=>30+x/9*240,svY=d=>290-d/9*250;
function svPool(){const s=tdS.volleyball,def=SV_DEF.map(n=>VB_P.find(p=>p.n===n));if(s&&s.picks.every(Boolean))return s.picks.filter(p=>p.pos!=="L").concat(def.filter(d=>!s.picks.includes(d))).slice(0,9);return def}
function newSV(server){svS.v={server,n:0,score:0,log:[],phase:server?"aimX":"pick",t0:performance.now(),cx:4.5,cd:5,hist:[],res:null,def:[[1.5,2.6],[4.5,2.6],[7.5,2.6],[1.5,6.6],[4.5,6.6],[7.5,6.6]]};return svS.v}
const svTri=(t,per)=>{const ph=(t%(2*per))/per;return ph<1?ph:2-ph};
function svLoop(){const s=svS.v;if(!s||(s.phase!=="aimX"&&s.phase!=="aimD")){svRAF=null;return}const m=document.getElementById("svAim");if(!m){svRAF=null;return}const r=s.server.r,t=performance.now()-s.t0;
  if(s.phase==="aimX"){s.cx=-1+svTri(t,(0.9+(r-75)*.04)*1000)*11;s.cd=8}else s.cd=svTri(t,(0.8+(r-75)*.035)*1000)*10.6;m.setAttribute("cx",svX(s.cx));m.setAttribute("cy",svY(s.cd));svRAF=requestAnimationFrame(svLoop)}
function svLock(){const s=svS.v;if(!s)return;if(s.phase==="aimX"){s.ax=s.cx;s.phase="aimD";s.t0=performance.now();rerender()}else if(s.phase==="aimD"){s.ad=s.cd;svServe()}}
function svServe(){const s=svS.v,x=s.ax,d=s.ad;let r;
  if(d<0.6)r=["Into the net!",0];else if(x<0||x>9)r=["Wide! Out.",0];else if(d>9)r=["Long! Out.",0];
  else{const md=Math.min(...s.def.map(([px,pd])=>Math.hypot(px-x,pd-d)));r=md>1.8?["ACE!",3]:md>1?["Tough serve, shanked pass",2]:["Passed well",1];s.hist.push([x,d])}
  s.phase="anim";s.res=r;s.land=[x,Math.min(Math.max(d,0.2),10.4)];rerender();
  setTimeout(()=>{s.n++;s.score+=r[1];s.log.push(r[1]);
    if(s.hist.length){const h=s.hist.slice(-4),mx=h.reduce((a,v)=>a+v[0],0)/h.length,md=h.reduce((a,v)=>a+v[1],0)/h.length;s.def=s.def.map(([px,pd])=>[px+(mx-px)*.18,pd+(md-pd)*.12])}
    if(s.n>=12){s.phase="over";const bs=store.get("fb-volleyball-sv",0);if(s.score>bs){store.set("fb-volleyball-sv",s.score);s.rec=true}}else{s.phase="aimX";s.t0=performance.now()}rerender()},1300)}

    el.querySelectorAll("[data-sv]").forEach(x=>x.onclick=()=>{newSV(svPool()[+x.dataset.sv]);rerender()});return}

  <div class="pk-wrap"><div class="svcourt" id="svc"><svg viewBox="0 0 300 330" aria-hidden="true"><rect x="30" y="40" width="240" height="250" class="vfloor"/><path d="M30 207 H270" class="vline"/><rect x="22" y="288" width="256" height="6" class="vnet"/>
    ${s.def.map(([px,pd])=>`<circle cx="${svX(px)}" cy="${svY(pd)}" r="11" class="rcv"/>`).join("")}

    ${aim?`${s.phase==="aimD"?`<path d="M${svX(s.ax)} 30 V300" class="guide"/>`:""}<circle id="svAim" cx="${svX(s.cx)}" cy="${svY(s.cd)}" r="9" class="aim"/>`:""}
    ${s.phase==="anim"||s.phase==="over"&&s.land?`<circle cx="${svX(s.land[0])}" cy="${svY(s.land[1])}" r="7" class="vball"/>`:""}
    </svg>${s.res&&!aim?`<div class="pk-banner" style="top:42%">${esc(s.res[0])}</div>`:""}</div>
  <div class="side"><div class="box"><span class="label">${s.phase==="over"?"Finished":`Serve ${s.n+1} of 12`}</span><h3 style="margin-top:4px">${esc(s.server.n)}</h3>
    <div class="xinums"><div><b class="count">${s.score}</b><span class="label">points</span></div><div><b class="count">${s.log.filter(v=>v===3).length}</b><span class="label">aces</span></div></div>
    <div class="dots" style="margin-top:12px">${s.log.map(v=>`<i class="dot ${v===3?"g":v===0?"m":"half"}"></i>`).join("")}${Array(12-s.log.length).fill('<i class="dot"></i>').join("")}</div>
    ${aim?`<div class="btns"><button class="btn" data-s="lock">${s.phase==="aimX"?"Set direction":"Serve"}</button></div>`:""}
    ${s.phase==="over"?`<p class="msg good">${s.rec?"New record! ":""}You scored ${s.score} of 36.</p><div class="btns"><button class="btn" data-s="again">Serve again</button><button class="btn ghost" data-s="pick">Change server</button></div>`:`<div class="btns"><button class="btn ghost" data-s="pick">Change server</button></div>`}
    <p class="gnote">Best: ${store.get("fb-volleyball-sv",0)} · green = ace, red = error</p></div></div></div>`;
  const on=(k,f)=>{const x=el.querySelector(`[data-s="${k}"]`);if(x)x.onclick=f};on("lock",svLock);on("again",()=>{newSV(s.server);rerender()});on("pick",()=>{newSV(null);rerender()});

    el.querySelectorAll("[data-szy]").forEach(x=>x.onclick=()=>{szS[b].sel=x.dataset.szy;szRender(b,el,myR,myName,onNew)});
    el.querySelector('[data-sz="start"]').onclick=()=>{szS[b].S=szNewSeason(b,szS[b].sel,myR,myName);szRender(b,el,myR,myName,onNew)};
    const nw=el.querySelector('[data-sz="new"]');if(nw)nw.onclick=onNew;return}
  const S=s.S,kind=S.kind,lg=S.C[0],last=S.log[0],nx=szNext(S),played=S.log.length;
  const tblRows=st=>{const tab=st.final||szSort(st.rows),me=tab.findIndex(r=>r.me),show=tab.length>12&&!s.full?tab.map((r,i)=>i<6||Math.abs(i-me)<=2||i>=tab.length-2?i:-1).filter(i=>i>=0):tab.map((_,i)=>i);
    let prev=-1;return show.map(i=>{const r=tab[i],gap=prev>=0&&i>prev+1?`<tr class="gap"><td colspan="6">…</td></tr>`:"";prev=i;return gap+`<tr class="${r.me?"fbrow":""}"><td class="pos">${i+1}</td><td class="tm">${esc(r.me?S.my.n:r.n)}</td><td>${r.p}</td><td>${kind==="fb"?`${r.w}-${r.d}-${r.l}`:`${r.w}-${r.l}`}</td><td class="hm">${r.f}:${r.a}</td><td class="kc">${r.pts}</td></tr>`}).join("")};
  const table=(st,title)=>`<div class="tscroll"><table class="stand sztab"><thead><tr><th class="pos">#</th><th class="tm">${t("Team")}</th><th>${t("col:P")}</th><th>${t(kind==="fb"?"W-D-L":"W-L")}</th><th class="hm">${t(kind==="vb"?"Sets":kind==="fb"?"Goals":"Points")}</th><th class="kc">${t("col:Pts")}</th></tr></thead><tbody>${tblRows(st)}</tbody></table></div>`;
  const pathLi=p=>p.table?`<li class="w"><span class="label">${esc(szStageName(p.st))}</span><b>${tf("Finished {p} of {n}",{p:ordL(p.pos),n:p.txt.split("/")[1]})}</b></li>`
    :p.games?`<li class="${p.win?"w":"l"}"><span class="label">${esc(szStageName(p.st))}</span><b>${esc(p.opp)}</b><span class="res">${p.games.map(g=>szScoreTxt(S,{g})).join(", ")}</span></li>`:`<li class="l"><span class="label">${esc(szStageName(p.st))}</span><b>${esc(t(p.txt))}</b></li>`;
  const compCard=c=>{const live=c.stage&&(c.stage.t==="rr"||c.stage.t==="lp")&&c.id!=="lg"?table(c.stage):"";const st=c.status==="won"?`<span class="chip win">${t("Winners")}</span>`:c.status==="out"?`<span class="chip loss">${t("Out")}</span>`:c.status==="done"?"":`<span class="chip">${t("Still in")}</span>`;
    return `<article class="card szcomp"><header><h3>${esc(c.id==="eu"?szStageName((c.stage?c.stage.name:c.path[c.path.length-1].st).split(" · ")[0]):t(c.name))}</h3>${st}</header><ol class="szpath">${c.path.filter(p=>c.id!=="lg"||!p.table).map(pathLi).join("")}${c.stage&&c.stage.t==="ko"?`<li class="next"><span class="label">${esc(szStageName(c.stage.name))}</span><b>${c.stage.opp?esc(c.stage.opp.n):t("Draw to come")}</b></li>`:""}</ol>${live}</article>`};
  const lastCard=last?`<article class="card szlast"><span class="label">${esc(szStageName(last.comp))}${last.round?` · ${tf("Matchday {n}",{n:last.round})}`:""}${last.leg&&last.fmt==="2L"?` · ${tf("Leg {n}",{n:last.leg})}`:last.leg?` · ${tf("Game {n}",{n:last.leg})}`:""}</span>
     <div class="szscore"><span class="${last.ha!==-1?"fb":""}">${esc(last.ha===-1?last.opp:S.my.n)}</span><b>${last.ha===-1?`${last.g.s[1]}–${last.g.s[0]}`:`${last.g.s[0]}–${last.g.s[1]}`}</b><span class="${last.ha===-1?"fb":""}">${esc(last.ha===-1?S.my.n:last.opp)}</span></div>

      <button class="linkbtn" data-sz="full">${s.full?t("Show fewer"):t("Show the full table")}</button></article>

  const on=(k,f)=>{const x=el.querySelector(`[data-sz="${k}"]`);if(x)x.onclick=f},re=()=>szRender(b,el,myR,myName,onNew);

  const f=ov.querySelector("input")||ov.querySelector("[data-ovx]");setTimeout(()=>f&&f.focus(),20)}

/* ---------- 7. Search ---------- */
let SIX=null;
const sn=s=>String(s).toLocaleLowerCase("tr").replace(/ç/g,"c").replace(/ğ/g,"g").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ş/g,"s").replace(/ü/g,"u").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[–—−]/g,"-").replace(/\s*-\s*(?=\d)/g,"-").replace(/[^\p{L}\p{N}\- ]/gu," ").replace(/\s+/g," ").trim();
function searchIndex(){if(SIX)return SIX;const I=[],push=(kind,label,sub,hay,act,b)=>I.push({kind,label,sub,lab:sn(label),hay:sn(label+" "+(sub||"")+" "+String(hay||"").replace(/(\d{4})-(\d{2})(?:-(\d{2}))?/g,"$1 $2 $3")),act,b});
  ppIndex().forEach(e=>push("p",e.n,[...e.b].map(b=>t(SPORTS[b].label)).join(" · "),"",{player:e.n}));
  Object.entries(SPORTS).forEach(([b,S])=>{(S.games||[]).forEach((g,i)=>push("g",g.res?`${g.home} ${g.res} ${g.away}`:t(g.title),`${t(g.comp)} · ${fmtDate(g.date)} · ${t(S.label)}`,`${g.comp} ${g.date} ${g.note} ${g.tag}`,{b,tb:"games",i},b));
    (S.history||[]).forEach((h,i)=>push("h",`${h[0]} · ${t(h[1])}`,t(S.label),`${h[1]} ${h[2]}`,{b,tb:"history",i},b));
    (S.trophies||[]).forEach((x,i)=>push("t",`${x[0]} × ${t(x[1])}`,`${t(S.label)} · ${t(x[2])}`,x[1]+" "+x[2],{b,tb:"trophies"},b))});
  SEASON_POS.forEach(([s,pos])=>{if(+s.slice(0,4)>=1959)push("s",`${s} · ${t("Süper Lig")}`,pos===1?t("Champions"):tf("Finished {p}",{p:ordL(pos)}),"season sezon",{b:"football",tb:"history"},"football")});
  [["basketball",MB_LINEUPS],["womens-basketball",WB_LINEUPS]].forEach(([b,LS])=>LS.forEach(L=>push("g",`${L.label} · ${L.title}`,`${t("vs")} ${L.opp} · ${L.score} · ${t(SPORTS[b].label)}`,`${L.date} ${L.where}`,{b,play:"lineup",lu:L.id},b)));
  HOME_BR.forEach(b=>{const L=LIVE[b];if(!L)return;L.last.forEach(r=>push("m",`Fenerbahçe ${r[4]}–${r[5]} ${r[3]}`,`${t(r[1])} · ${r[0]?mDate(r[0],true):t(r[6]||"")} · ${t(SPORTS[b].label)}`,`${r[0]} ${r[6]||""}`,{b,tb:"matches"},b))});
  runExt("search",I,push);SIX=I;return I}
const SKIND={p:"Players",g:"Big games and finals",m:"This season's results",h:"History",t:"Trophies",s:"Seasons"};
function runSearch(q){const toks=sn(q).split(/\s+/).filter(Boolean);if(!toks.length)return [];const lq=sn(q);
  const scRx=toks.filter(k=>/^\d+-\d+$/.test(k)).map(k=>new RegExp("(^|[^\\d])"+k+"($|[^\\d])"));
  return searchIndex().map(it=>{if(!toks.every(k=>/^\d+-\d+$/.test(k)||it.hay.includes(k))||!scRx.every(r=>r.test(it.lab)||r.test(it.hay.replace(/\d{4} \d{2} \d{2}/g,""))))return null;let sc=0;const l=sn(it.label);if(l.startsWith(lq))sc+=5;if(l.includes(lq))sc+=3;if(it.kind==="p")sc+=2;if(it.b===current)sc+=1;return {it,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,40).map(x=>x.it)}
function openSearch(){ovOpen(`<div class="srch"><h2>${t("Search")}</h2><input id="sq" type="search" autocomplete="off" placeholder="${t("Players, seasons, finals, scores…")}" aria-label="${t("Search")}"><p class="fine">${t("Try a name, a year, a competition or a score like 6–0.")}</p><div id="sres" aria-live="polite"></div></div>`,t("Search"));
  const inp=$("sq");let tm=null;inp.addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(()=>showResults(inp.value),120)});
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){const f=$("sres").querySelector("[data-sr]");if(f)f.click()}})}
let SRES=[];
function showResults(q){const R=runSearch(q);SRES=R;const box=$("sres");if(!q.trim()){box.innerHTML="";return}
  if(!R.length){box.innerHTML=`<p class="muted">${t("Nothing found.")}</p>`;return}

  box.innerHTML=Object.entries(groups).map(([k,L])=>`<section><h4 class="mh">${t(SKIND[k])}</h4><ul class="sreslist">${L.slice(0,8).map(([it,i])=>`<li><button data-sr="${i}"><b>${esc(it.label)}</b><span>${esc(it.sub||"")}</span></button></li>`).join("")}</ul></section>`).join("");

    goItem(a.b,a.tb,a.i)})}

/* ===== Title race: simulate the rest of the league thousands of times from the current table.
   Fenerbahçe's own upcoming league games can be set to win, draw or loss. All odds are estimates. ===== */
const RACE_NEXT={"Basketbol Süper Ligi":"BSL"};
function raceTables(b){const L=LIVE[b];if(!L||!L.tables)return [];return L.tables.map((T,i)=>({T,i})).filter(({T})=>T.rows&&T.rows.length>=4&&T.cols.includes("P")&&T.rows.some(r=>r[0]==="Fenerbahçe"))}
function raceKind(T){return T.cols.includes("D")?"fb":/Sultanlar|Efeler/.test(T.comp)?"vb":"bb"}
let RS={};
function raceState(b){const tabs=raceTables(b);if(!tabs.length)return null;let s=RS[b];if(!s||!tabs[s.ti]){s=RS[b]={ti:0,fix:{},form:0}}return s}
/* table names can differ from result names by a sponsor ("Galatasaray" / "Galatasaray Daikin") */
function raceTeamIdx(teams,name){let j=teams.findIndex(x=>x.n===name);if(j<0)j=teams.findIndex(x=>name.startsWith(x.n+" ")||x.n.startsWith(name+" "));return j}
function raceData(b,s){const {T}=raceTables(b)[s.ti],kind=raceKind(T),ci=c=>T.cols.indexOf(c),P=ci("P"),W=ci("W"),D=ci("D"),Lc=ci("L"),n=T.rows.length,total=2*(n-1);
  const teams=T.rows.map(r=>{const p=+r[P+1],w=+r[W+1],d=D>=0?+r[D+1]:0,l=+r[Lc+1],pts=kind==="bb"&&ci("Pts")<0?w:+r[T.key+1];return {n:r[0],p,w,d,l,pts,left:Math.max(0,total-p)}});
  const nextComp=RACE_NEXT[T.comp]||T.comp,fx=(LIVE[b].next||[]).filter(x=>x[2]===nextComp).slice(0,8),fb=teams.findIndex(x=>x.n==="Fenerbahçe");
  /* Fenerbahçe's remaining league games: everyone twice, once at home and once away, minus the games already played.
     Only used when the results list covers every game in the table, so the opponents and venues are exact. */
  let rem=null;if(fb>=0){const played=LIVE[b].last.filter(r=>r[1]===T.comp||r[1]===nextComp);
    if(played.length===teams[fb].p){const need=new Map();teams.forEach((x,j)=>{if(j!==fb){need.set(j+"H",1);need.set(j+"A",1)}});let ok=true;
      played.forEach(r=>{const j=raceTeamIdx(teams,r[3]),k=j+(r[2]==="A"?"A":"H");if(j<0||!need.has(k)){ok=false;return}need.delete(k)});
      if(ok){rem=[];fx.forEach((f,k)=>{const j=raceTeamIdx(teams,f[4]),key=j+(f[3]==="A"?"A":"H");if(j>=0&&need.has(key)){need.delete(key);rem.push({j,home:f[3]!=="A",fx:k})}});
        [...need.keys()].forEach(key=>rem.push({j:parseInt(key,10),home:key.endsWith("H"),fx:null}));if(rem.length!==teams[fb].left)rem=null}}}
  return {T,kind,teams,total,fx,n,fb,rem}}
/* home advantage on the log-odds scale: about 60% home wins in basketball, a little less in football and volleyball */
const RACE_HOME={fb:.3,bb:.4,vb:.2};
/* one season run: returns final order of team indexes */
function raceRun(D,s,str){const pts=D.teams.map(x=>x.pts),wins=D.teams.map(x=>x.w),left=D.teams.map(x=>x.left),n=D.n,fb=D.fb,HA=RACE_HOME[D.kind];
  const award=(i,j,res)=>{/* res: 1 i wins, 0 draw, -1 j wins */
    if(D.kind==="fb"){if(res>0)pts[i]+=3;else if(res<0)pts[j]+=3;else{pts[i]++;pts[j]++}}
    else if(D.kind==="vb"){const tie=Math.random()<.25;if(res>0){pts[i]+=tie?2:3;if(tie)pts[j]+=1;wins[i]++}else{pts[j]+=tie?2:3;if(tie)pts[i]+=1;wins[j]++}}
    else{const ptsMode=D.T.cols.includes("Pts");if(res>0){wins[i]++;pts[i]+=ptsMode?2:1;if(ptsMode)pts[j]+=1}else{wins[j]++;pts[j]+=ptsMode?2:1;if(ptsMode)pts[i]+=1}}};

function addZip(L,en,x){if(x==null||en==null)return;

const TR_SKIP="script,style,textarea,[translate=no]";
function trDom(root){if(LANG==="en"||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{const p=n.parentElement;if(!p||p.closest(TR_SKIP))return;const v=n.nodeValue,s=v.trim();if(!s||!/[A-Za-z]/.test(s))return;const r=trText(s);if(r!=null&&r!==s)n.nodeValue=v.replace(s,r)});
  root.querySelectorAll("[placeholder],[aria-label],[title]").forEach(el=>{if(el.closest(TR_SKIP))return;["placeholder","aria-label","title"].forEach(a=>{const v=el.getAttribute(a);if(!v)return;const r=trText(v.trim());if(r!=null&&r!==v)el.setAttribute(a,r)})})}

/* ===== Language packs: translations load on demand, so English visitors don't download them ===== */
const PACK_OK={},PACK_WAIT={};
function LANGPACK(L,p){const D=DICT[L],Lo=LOWER[L];Object.assign(D,p.d);
  Object.keys(p.d).forEach(en=>{const k=en.toLowerCase();if(!Lo[k])Lo[k]=[en,D[en]]});(p.o||[]).forEach(([k,en,x])=>Lo[k]=[en,x]);
  PACK_OK[L]=true;TCACHE.clear()}
function loadPack(L){if(L==="en"||PACK_OK[L])return Promise.resolve(true);if(PACK_WAIT[L])return PACK_WAIT[L];
  PACK_WAIT[L]=new Promise(res=>{const s=document.createElement("script");s.src=`lang-${L}.js`;s.async=true;s.onload=()=>res(!!PACK_OK[L]);s.onerror=()=>{delete PACK_WAIT[L];res(false)};document.head.appendChild(s)});return PACK_WAIT[L]}
function buildI18n(){
  ["tr","de"].forEach((L,li)=>{PATTERNS[L]=I18N_PATS.map(p=>[p[0],p[1+li]]).filter(p=>p[1]!=null);PATTERNS[L].push([/^.+$/,m=>trDate(m[0])])});
  XLANGS.forEach((L,li)=>{PATTERNS[L]=I18N_PATS.map((p,i)=>{const x=I18N_PATS_X[i];return [p[0],x?x[li]:p[2]]}).filter(p=>p[1]!=null);PATTERNS[L].push([/^.+$/,m=>trDate(m[0])])})}
function applyLang(){staticTexts();render();renderOnThisDay();if(typeof kanRender==="function")kanRender()}
function setLang(c){if(c==="ar"&&window.loadFont)loadFont(FONT_EXTRA.ar);if(!LANGS.some(l=>l[0]===c))return;const prev=LANG;
  if(c==="en"||PACK_OK[c]){LANG=c;try{localStorage.setItem("fb-lang",c)}catch(e){}applyLang();return}
  document.documentElement.classList.add("lwait");
  loadPack(c).then(ok=>{document.documentElement.classList.remove("lwait");if(!ok){$("lang").value=prev;return}LANG=c;try{localStorage.setItem("fb-lang",c)}catch(e){}applyLang()})}
function initLang(){if(LANG==="ar"&&window.loadFont)loadFont(FONT_EXTRA.ar);buildI18n();$("lang").innerHTML=LANGS.map(([c,n])=>`<option value="${c}">${n}</option>`).join("");$("lang").addEventListener("change",e=>setLang(e.target.value));
  const want=LANG;if(want!=="en"&&!PACK_OK[want]){LANG="en";document.documentElement.classList.add("lwait");const done=()=>document.documentElement.classList.remove("lwait");
    const tm=setTimeout(done,2500);loadPack(want).then(ok=>{clearTimeout(tm);done();if(ok){LANG=want;applyLang()}})}
  staticTexts();watchPanel()}

/* ===== Stand-alone site: Supabase stands in for the Claude page features (db, user, room, downloads) =====
   Only included in the GitHub Pages build. Inside Claude the real window.claude is used instead. */
(function(){
  if(window.claude&&window.claude.use)return;
  const CFG=window.FB_SB||{};
  const ok=()=>!!(CFG.url&&CFG.key&&window.supabase&&window.supabase.createClient);
  let sb=null,uidP=null;
  const client=()=>{if(!sb&&ok())sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"fb-auth"},realtime:{params:{eventsPerSecond:10}}});return sb};
  /* every visitor gets an anonymous account the first time, kept in this browser */
  function uid(){if(uidP)return uidP;uidP=(async()=>{const c=client();if(!c)return null;
    let {data}=await c.auth.getSession();if(data&&data.session)return data.session.user.id;
    const r=await c.auth.signInAnonymously();if(r.error)throw r.error;return r.data.user.id})().catch(e=>{uidP=null;console.warn("[fb] sign-in",e&&e.message);return null});return uidP}
  const COLS=["predictions","motm","scores","ratings","seasons","challenges","watch"];

  /* ---- db: collection(col).onSnapshot(cb) and doc("col/id").set(data) ---- */
  /* what each shared collection keeps in this browser, so an account's saved data shows up on a new device */
  const LOCAL={predictions:["p","fb-preds"],motm:["v","fb-motm"],ratings:["r","fb-ratings"],challenges:["c","fb-ch"],seasons:["b","fb-sz-rec"],watch:["w","fb-watch"]};
  let REMOTE_SCORES={};
  function hydrate(c,me){return c.from("docs").select("col,data").eq("id",me).then(({data,error})=>{if(error)return;let changed=false;
    (data||[]).forEach(r=>{if(r.col==="scores"){REMOTE_SCORES=(r.data&&r.data.s)||{};return}const L=LOCAL[r.col];if(!L||typeof store==="undefined")return;const rem=(r.data&&r.data[L[0]])||{};
      const loc=store.get(L[1],{})||{};let n=0;Object.keys(rem).forEach(k=>{if(!(k in loc)){loc[k]=rem[k];n++}});if(n){store.set(L[1],loc);changed=true}});
    if(changed)setTimeout(()=>{try{xRefresh();if(typeof xBadgeCheck==="function")xBadgeCheck()}catch(e){}},0)}).catch(()=>{})}
  function makeDb(me){const c=client();const hyd=hydrate(c,me);
    const docSnap=(id,d)=>({id,exists:true,data:()=>d});
    return {
      collection(col){return {onSnapshot(cb,err){if(!COLS.includes(col)){err&&err(new Error("unknown collection"));return ()=>{}}
        const m={};let alive=true;const emit=()=>{if(alive)cb({docs:Object.entries(m).map(([id,d])=>docSnap(id,d))})};
        c.from("docs").select("id,data").eq("col",col).limit(5000).then(({data,error})=>{if(error){err&&err(error);return}(data||[]).forEach(r=>m[r.id]=r.data);emit()});
        const ch=c.channel("db-"+col+"-"+Math.random().toString(36).slice(2,8)).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"col=eq."+col},p=>{
          if(p.eventType==="DELETE"){const id=p.old&&p.old.id;if(id){delete m[id];emit()}return}const r=p.new;if(r&&r.id){m[r.id]=r.data;emit()}}).subscribe();
        return ()=>{alive=false;c.removeChannel(ch)}}}},
      doc(path){const [col,id]=path.split("/");return {
        async set(data){if(!COLS.includes(col)||id!==me)throw Object.assign(new Error("not allowed"),{code:"forbidden"});await hyd;
          if(col==="scores"&&data&&data.s){const s={...data.s};Object.entries(REMOTE_SCORES).forEach(([k,v])=>{if(typeof v==="number"&&!(s[k]>=v))s[k]=v});data={...data,s};REMOTE_SCORES=s}
          const {error}=await c.from("docs").upsert({col,id,data,updated_at:new Date().toISOString()});if(error)throw error},
        async get(){const {data}=await c.from("docs").select("data").eq("col",col).eq("id",id).maybeSingle();return {id,exists:!!data,data:()=>data&&data.data}}}}}}

  /* ---- user: id() and profiles(ids); fans pick their own name in Settings ---- */
  const NAMES={};
  function makeUser(me){const c=client();
    /* when another fan renames themselves, update the boards without a reload */
    c.channel("profiles-"+Math.random().toString(36).slice(2,8)).on("postgres_changes",{event:"*",schema:"public",table:"profiles"},p=>{const r=p.new;if(!r||!r.id)return;NAMES[r.id]=r.name||"";
      try{if(typeof XC!=="undefined"&&r.id in XC.names)XC.names[r.id]=NAMES[r.id];if(typeof RT!=="undefined"&&r.id in RT.names)RT.names[r.id]=NAMES[r.id];if(typeof xRefresh==="function")xRefresh()}catch(e){}}).subscribe();
    return {
    async id(){return me},
    async profiles(ids){ids=[...new Set(ids)].filter(Boolean);const out={};const need=ids.filter(i=>!(i in NAMES));
      if(need.length){const {data}=await c.from("profiles").select("id,name").in("id",need.slice(0,200));need.forEach(i=>NAMES[i]="");(data||[]).forEach(r=>NAMES[r.id]=r.name||"")}
      ids.forEach(i=>out[i]={name:NAMES[i]||""});return out},
    async setName(n){n=String(n||"").replace(/\s+/g," ").trim().slice(0,24);const {error}=await c.from("profiles").upsert({id:me,name:n,updated_at:new Date().toISOString()});if(error)throw error;NAMES[me]=n;return n},
    myName(){return NAMES[me]||""}}}

  /* ---- room: join(name) gives emit/on/presence/peers/onPeers/leave over Supabase Realtime ---- */
  function makeRoom(me){const c=client(),conn=Math.random().toString(36).slice(2,12);
    function open(name){const ch=c.channel("room:"+String(name).slice(0,60),{config:{broadcast:{self:true,ack:false},presence:{key:conn}}});
      let pres={},joined=false;const peerL=new Set(),msgL={};
      const peers=()=>{const st=ch.presenceState();return Object.entries(st).map(([k,metas])=>{const m=metas[metas.length-1]||{};const {by,presence_ref,...rest}=m;return {peer:k,by,isMe:by===me,sameTab:k===conn,kind:"viewer",presence:rest.p||{}}})};
      let prev={};const firePeers=()=>{const P=peers(),now={};P.forEach(p=>now[p.peer]=p);const joined=P.filter(p=>!prev[p.peer]),left=Object.values(prev).filter(p=>!now[p.peer]),updated=P.filter(p=>prev[p.peer]&&JSON.stringify(prev[p.peer].presence)!==JSON.stringify(p.presence));prev=now;
        peerL.forEach(f=>{try{f({peers:P,joined,left,updated})}catch(e){}})};
      ch.on("presence",{event:"sync"},firePeers);
      ch.on("broadcast",{event:"*"},({event,payload})=>{const L=msgL[event];if(!L||!payload)return;const P=peers().find(p=>p.peer===payload.peer);
        const m={topic:event,kind:"viewer",data:payload.data,peer:payload.peer,by:payload.by,isMe:payload.by===me,sameTab:payload.peer===conn,presence:P?P.presence:{}};L.forEach(f=>{try{f(m)}catch(e){}})});
      const ready=new Promise((res,rej)=>ch.subscribe(st=>{if(st==="SUBSCRIBED"){joined=true;ch.track({by:me,p:pres}).catch(()=>{});res()}else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT")rej(new Error(st))}));
      const R={
        async emit(type,data){await ready;const r=await ch.send({type:"broadcast",event:type,payload:{data,peer:conn,by:me}});if(r!=="ok")throw new Error("send "+r)},
        on(type,f){(msgL[type]=msgL[type]||new Set()).add(f);return ()=>msgL[type].delete(f)},
        /* like the Claude room: keys are merged, a null value removes the key */
        async presence(patch){pres={...pres};Object.entries(patch||{}).forEach(([k,v])=>{if(v===null)delete pres[k];else pres[k]=v});await ready;await ch.track({by:me,p:pres})},
        peers,onPeers(f){peerL.add(f);if(joined)setTimeout(()=>{const P=peers();f({peers:P,joined:P,left:[],updated:[]})},0);return ()=>peerL.delete(f)},
        connected:()=>joined,onConnection(f){ready.then(()=>f(true),()=>f(false));return ()=>{}},
        async leave(){try{await ch.untrack()}catch(e){}try{await c.removeChannel(ch)}catch(e){}},
        async join(n){return openRoom(n)}};
      R._ready=ready;return R}
    const cache={};async function openRoom(n){if(cache[n])return cache[n];const r=open(n);cache[n]=r;try{await r._ready}catch(e){delete cache[n];throw e}const leave=r.leave;r.leave=()=>{delete cache[n];return leave()};return r}
    return openRoom("lobby")}

  /* ---- downloads: an ordinary browser download ---- */
  const downloads={async save({filename,data}){const blob=data instanceof Blob?data:new Blob([data],{type:/\.csv$/i.test(filename)?"text/csv;charset=utf-8":"application/octet-stream"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename||"download";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return {saved:true}}};

  /* ---- accounts: username + password; the guest account becomes the permanent one, so nothing is lost ---- */
  const U_DOM="fans.fenerbahcefanhub.app";
  const uMail=u=>u+"@"+U_DOM;
  const uOk=u=>/^[a-z0-9][a-z0-9._-]{1,18}[a-z0-9]$/.test(u);
  const err=(code)=>Object.assign(new Error(code),{code});
  const authErr=e=>{const m=((e&&(e.code||""))+" "+(e&&e.message||"")).toLowerCase();if(e&&e.status===429||/rate limit|too many/.test(m))return err("slow");
    if(/already|exists|registered|taken/.test(m))return err("taken");if(/invalid login|credentials/.test(m))return err("wrong");if(/password/.test(m)&&/(short|least|weak|characters)/.test(m))return err("pw");return err("net")};
  async function account(){const c=client();if(!c)return null;const {data}=await c.auth.getSession();const u=data&&data.session&&data.session.user;if(!u)return null;
    const em=u.email||"";return {anon:!!u.is_anonymous||!em,username:em.endsWith("@"+U_DOM)?em.slice(0,-U_DOM.length-1):(em||null)}}
  async function register(name,pw){const c=client();if(!c)throw err("net");const u=String(name||"").trim().toLowerCase();if(!uOk(u))throw err("name");if(String(pw||"").length<6)throw err("pw");

    const r=await c.auth.signInWithPassword({email:uMail(u),password:pw});if(r.error)throw authErr(r.error);return u}

    /* the next visitor on this browser starts fresh, without this account's predictions and votes */
    if(typeof store!=="undefined")Object.values(LOCAL).forEach(([,k])=>{try{store.set(k,{})}catch(e){}})}

  const cache={};
  window.FB_SITE={on:false,client,uid,account,register,login,logout};

    return null}};
})();
